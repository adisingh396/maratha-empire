 ORI_madhusudan_das: "Madhusudan Das"
 ORI_harekrushna_mahatab: "Harekrushna Mahatab"
 ORI_nabakrushna_choudhury: "Nabakrushna Choudhury"
 ORI_gopabandhu_das: "Gopabandhu Das"
 ORI_pratap_bhanj: "Pratap Chandra Bhanj Deo"
 ORI_sriram_bhanj: "Sriram Chandra Bhanj Deo"
 ORI_rajendra_singhdeo: "Rajendra Narayan Singh Deo"
 ORI_sarangadhar_das: "Sarangadhar Das"
 ORI_kharavela: "Emperor Kharavela"
 ORI_shankar_dhenkanal: "Raja Shankar Pratap Singh Deo"

 ORI_krushna_unifier: "Architect of Utkal"
 ORI_krushna_unifier_desc: "The Raja of Paralakhemundi carried the cause of an undivided Odia land from the drawing-rooms of the courts to the halls of state, and he means to see it made whole."
 ORI_utkal_gouraba: "Utkal Gouraba"
 ORI_utkal_gouraba_desc: "The father of Odia nationalism founded the Utkal Sammilani and the Utkal Tannery; his pen and his enterprise gave a scattered people a name to rally behind."
 ORI_utkal_keshari: "Utkal Keshari"
 ORI_utkal_keshari_desc: "The Lion of Utkal turns crowds with a phrase; where he speaks, the Praja Mandal follows."
 ORI_gandhian_socialist: "Gandhian Socialist"
 ORI_gandhian_socialist_desc: "A conscience that will not be bought, he binds the peasant leagues to the language of justice rather than the language of the throne."
 ORI_utkalmani: "Utkalmani's School"
 ORI_utkalmani_desc: "The Jewel of Utkal built the Satyabadi school on open ground under the mango trees; his ideal of service still shapes the young men who plan the nation's wars and works."
 ORI_mayurbhanj_crown: "Crown of Mayurbhanj"
 ORI_mayurbhanj_crown_desc: "The last ruling chief of the richest Garjat commands the iron hills and the loyalty of men raised to arms in the largest princely state of the land."
 ORI_model_maharaja: "The Model Maharaja"
 ORI_model_maharaja_desc: "Sriram Chandra's blueprint for a modern princely state — schools, mills, and railways — still runs the workshops of Mayurbhanj."
 ORI_feudal_bloc: "The Feudal Bloc"
 ORI_feudal_bloc_desc: "The Raja of Patna marshals the conservative feudatories; every concession to the peasant leagues is a wound he will avenge in council."
 ORI_praja_organiser: "Praja Mandal Organiser"
 ORI_praja_organiser_desc: "An engineer schooled in America, he turned from steel to sedition, wiring the peasant risings into a disciplined movement."
 ORI_chedi_legacy: "The Chedi Legacy"
 ORI_chedi_legacy_desc: "The memory of Kharavela — conqueror, canal-builder, patron of arms — is graven in the Hathigumpha cave, and it teaches Kalinga how an empire is made."
 ORI_biju_wings: "Wings over the Delta"

 ORI_utkal_unity: "Utkal Unity"
 ORI_utkal_unity_desc: "One language, one people, one state. The scattered Odia tracts are bound at last into a single nation, and no prince may pull them apart.\nStability +10%\nPolitical Power Gain +12%\nDrift Defence +20%"
 ORI_jagannath_legitimacy: "Jagannath's Sacral Legitimacy"
 ORI_jagannath_legitimacy_desc: "The ruler kneels as the first servant of Lord Jagannath of Puri; the crown draws its right from the temple, and the people follow the deota's chariot.\nStability +8%\nPolitical Power Gain +10%\nWar Support +5%"
 ORI_sukinda_chromite: "Sukinda Chromite Belt"
 ORI_sukinda_chromite_desc: "The chromite seams of Sukinda feed the ferroalloy furnaces; Kalinga's steel will not want for hardening ore.\nResource Gain +20%\nArms Factory Construction +10%\nFactory Output +6%"
 ORI_mayurbhanj_iron: "Mayurbhanj Iron"
 ORI_mayurbhanj_iron_desc: "The ore of Gorumahisani and Keonjhar, that once fed the plains mills, now feeds our own furnaces.\nCivilian Factory Construction +12%\nFactory Output +10%\nResource Gain +10%"
 ORI_praja_mandal_reform: "Praja Mandal Reform"
 ORI_praja_mandal_reform_desc: "The peasant leagues have their assembly; the feudatory whip is broken and the people are enlisted in the making of the state.\nPolitical Power Gain +15%\nStability +6%\nConscription +5%"
 ORI_kalinga_maritime: "Kalinga Maritime Revival"
 ORI_kalinga_maritime_desc: "The sadhabas set sail once more for Suvarnabhumi; the old sea-roads of Kalinga carry trade and men again.\nDockyard Construction +12%\nTrade Opinion +10%\nNaval Organisation +8%"

 # ===== Focuses =====
 ORI_utkal_sammilani: "The Utkal Sammilani"
 ORI_utkal_sammilani_desc: "Convene the union of the Odia tracts that Madhusudan Das first dreamed in 1903, and begin the work of making one nation from many courts."
 ORI_odia_language_state: "One Language, One State"
 ORI_odia_language_state_desc: "Proclaim Odia the language of government — the first language-based state on the subcontinent."
 ORI_gather_garjats: "Gather the Garjats"
 ORI_gather_garjats_desc: "Bring the twenty and more feudatory states of the Garjat patchwork under a single flag."
 ORI_prince_bloc: "The Chamber of Rajas"
 ORI_prince_bloc_desc: "Bind the feudatory princes to the crown; let the temple and the throne rule together over an ordered land."
 ORI_praja_republic: "The People's Republic"
 ORI_praja_republic_desc: "Cast down the feudatory whip and raise the Praja Mandal assemblies in its place."
 ORI_mayurbhanj_model: "The Mayurbhanj Model"
 ORI_mayurbhanj_model_desc: "Make Sriram Chandra's modernised state the template every raja must follow."
 ORI_peoples_assembly: "The People's Assembly"
 ORI_peoples_assembly_desc: "Seat the peasant leagues and the language societies in a working legislature."
 ORI_mineral_survey: "Survey the Mineral Kingdom"
 ORI_mineral_survey_desc: "Map the chromite, iron, coal, and bauxite that make Kalinga the richest mineral belt in India."
 ORI_sukinda_belt: "The Sukinda Chromite Belt"
 ORI_sukinda_belt_desc: "Open the ferroalloy seams of Sukinda and the works that turn them into hardened steel."
 ORI_gorumahisani: "The Gorumahisani Hills"
 ORI_gorumahisani_desc: "No ore of Mayurbhanj shall leave Kalinga raw; the iron of the hills will fill our own furnaces."
 ORI_ferroalloy_works: "Kalinga Ferroalloy Works"
 ORI_ferroalloy_works_desc: "Marry chromite to iron and cast the special steels that arm a modern kingdom."
 ORI_kalinga_reborn: "Kalinga Reborn"
 ORI_kalinga_reborn_desc: "Wake the memory of Kharavela's fleets and the sea-power that once ruled the Bay."
 ORI_bali_jatra_trade: "The Bali Jatra Charter"
 ORI_bali_jatra_trade_desc: "Send the merchant sadhabas back down the old sea-roads to the Golden Land of the east."

 # ===== Events =====
 ORI_flav.1_t: "The Call of the Utkal Sammilani"
 ORI_flav.1_d: "In a hall at Cuttack the delegates of a dozen Odia tracts gather, as they first did under Madhusudan Das in 1903. For generations the Odia people have been split among alien administrations and quarrelling Garjat rajas; here, at last, is the chance to bind them into one. But shall unity be won by the consent of the courts, or wrung from the law?"
 ORI_flav.1_a: "Summon the Sammilani — bind the tracts by consent."
 ORI_flav.1_b: "Petition through the courts — a lawyer's unification."
 ORI_flav.2_t: "The Language of the State"
 ORI_flav.2_d: "A nation is its tongue. If Odia is made the language of government, the scattered people become one at a stroke — but the feudatory rajas, jealous of their little courts and their own dial'ects of power, will resist a single standard imposed from above."
 ORI_flav.2_a: "Make Odia the language of the state."
 ORI_flav.2_b: "Leave the princes their tongues — buy their loyalty instead."
 ORI_flav.3_t: "The First Language-State"
 ORI_flav.3_d: "No land on the subcontinent has ever drawn its borders around a language. If we proclaim it now, Kalinga becomes the first — a model that Tamil, Telugu, and Bengali speakers across India will watch with envy and hope."
 ORI_flav.3_a: "Proclaim the language-state — let all India take note."
 ORI_flav.3_b: "Delay — the Garjat rajas are not yet ready."
 ORI_flav.4_t: "The Garjat Rising"
 ORI_flav.4_d: "In Dhenkanal, Nilgiri, and Ranpur the peasants of the feudatory states have risen against the rajas' begar and tax. The Praja Mandal marches under the banner of an undivided Odisha. The crown must choose: ride the rising, or crush it."
 ORI_flav.4_a: "March with the Praja Mandal on the feudatory palaces."
 ORI_flav.4_b: "Call in the Raja's guards — restore feudal order."
 ORI_flav.5_t: "Baji Rout — The Ferry at Nilakanthapur"
 ORI_flav.5_d: "At the Brahmani ferry a boy of twelve, keeping the crossing for the Praja Mandal, refused to row the raja's police across in the dark. They shot him where he stood. Baji Rout, the child-martyr, is dead — and a movement has found its saint."
 ORI_flav.5_a: "Raise the boy-martyr as the banner of the republic."
 ORI_flav.5_b: "Mourn quietly — do not inflame the Garjats."
 ORI_flav.6_t: "The Feudatory Crackdown"
 ORI_flav.6_d: "The guards have cleared the streets and the ringleaders sit in the raja's gaols. Order is restored — but the peasant leagues have not forgotten, and the crown must decide whether the old feudal compact can hold, or whether it must bend before the next rising comes."
 ORI_flav.6_a: "Keep the rajas their thrones — bind them to the crown."
 ORI_flav.6_b: "Concede reform to head off the next rising."
 ORI_flav.7_t: "Bali Jatra — The Sadhabas Sail"
 ORI_flav.7_d: "On the full moon of Kartika the people of Cuttack float their little boats on the Mahanadi and cry 'Aa Ka Ma Boi' — remembering the day the merchant sadhabas set sail for Bali and the Golden Land. The old sea-power of Kalinga sleeps; shall we wake it?"
 ORI_flav.7_a: "Fund the merchant fleets to Suvarnabhumi."
 ORI_flav.7_b: "Keep the yards to coastal defence."
 ORI_flav.8_t: "The Chandbali Charter"
 ORI_flav.8_d: "The harbour at Chandbali could be the free port of the eastern coast, or the base of a war-navy. The merchants of Cuttack press for the one; the admirals for the other."
 ORI_flav.8_a: "Open the free port — let trade flow."
 ORI_flav.8_b: "Reserve the harbour for the war-navy."
 ORI_flav.9_t: "The Chromite of Sukinda"
 ORI_flav.9_d: "The surveyors return from the Sukinda valley with word of chromite seams richer than any in India — the very ore that hardens armour and cutting steel. Such wealth may be nationalised for the state, or licensed to the Marwari houses for ready capital."
 ORI_flav.9_a: "Nationalise the ferroalloy seams."
 ORI_flav.9_b: "License the seams to the Marwari houses for capital."
 ORI_flav.10_t: "The Iron of Gorumahisani"
 ORI_flav.10_d: "For a generation the ore of the Mayurbhanj hills has rolled north to feed the furnaces of the plains. Now the question is put plainly: shall Kalinga build its own steel, or grow rich selling its birthright raw?"
 ORI_flav.10_a: "Build our own steel — no ore leaves Kalinga raw."
 ORI_flav.10_b: "Sell ore to the plains mills and bank the revenue."
 ORI_flav.11_t: "Sriram Chandra's Blueprint"
 ORI_flav.11_d: "The great modernising Maharaja of Mayurbhanj left behind schools, mills, railways, and a model of enlightened rule that out-shone the plains. His heirs ask whether that blueprint should be forced on every Garjat, or offered freely for each to take up at his own pace."
 ORI_flav.11_a: "Make Mayurbhanj the template for every Garjat."
 ORI_flav.11_b: "Let each raja modernise at his own pace."
 ORI_flav.12_t: "The Model State Triumphant"
 ORI_flav.12_d: "The mills of Mayurbhanj hum, its schools are full, and merchants from the plains come to marvel. A princely state has out-competed the Congress heartland at its own game. What shall be made of this victory?"
 ORI_flav.12_a: "An enlightened crown, envied across India."
 ORI_flav.12_b: "Fold the model's gains into the unified state."
