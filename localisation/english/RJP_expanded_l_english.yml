l_english:
 RJP_fateh_singh: "Maharana Fateh Singh"
 RJP_birla: "G. D. Birla"
 RJP_bajaj: "Jamnalal Bajaj"
 RJP_pratap_singh: "Sir Pratap Singh"
 RJP_hanwant_singh: "Hanwant Singh"
 RJP_sardar_singh: "Maharaja Sardar Singh"
 RJP_singhania: "Seth Singhania"

 RJP_umaid_air: "Master of the Jodhpur Flying Club"
 RJP_umaid_air_desc: "Maharaja Umaid Singh's passion for aviation gives our fledgling air arm a patron at the very top of the state."
 RJP_fateh_pride: "Guardian of Rajput Honour"
 RJP_fateh_pride_desc: "The Maharana who refused to bow at Delhi is a living banner of Rajput pride, rallying the martial clans."
 RJP_birla_industry: "Marwari Industrial Magnate"
 RJP_birla_desc: "From the sands of Pilani to mills across the subcontinent, the House of Birla can bankroll a modern war economy."
 RJP_bajaj_finance: "Merchant-Financier of the Cause"
 RJP_bajaj_desc: "Jamnalal Bajaj bends his fortune and his hundi network to the service of the state."
 RJP_pratap_cavalry: "Master of the Lancer Tradition"
 RJP_pratap_cavalry_desc: "The old regent who raised the Jodhpur Lancers still teaches the doctrine of the desert horse."
 RJP_hanwant_air: "Prince of the Air"
 RJP_hanwant_air_desc: "The young Jodhpur heir is a natural aviator, eager to lead our squadrons himself."
 RJP_singhania_hundi: "Master of the Hundi Networks"
 RJP_singhania_desc: "The Shekhawati seths move silver across a thousand miles on a word and a slip of paper."

 RJP_warrior_caste: "The Rajput Warrior Caste"
 RJP_warrior_caste_desc: "The Kshatriya code of honour makes every thakur's household a recruiting ground. Rajputs march to war as their ancestors did at Haldighati."
 RJP_ganga_risala_corps: "The Ganga Risala Camel Corps"
 RJP_ganga_risala_corps_desc: "Bikaner's famed camel corps, mechanised and hardened to the Thar, ranges the desert where no other army can follow."
 RJP_marwari_capital: "Marwari Merchant Capital"
 RJP_marwari_capital_desc: "The banking houses of Birla, Bajaj and the Shekhawati seths pour their fortunes into factories and foundries."
 RJP_sisodia_prestige: "Prestige of the House of Mewar"
 RJP_sisodia_prestige_desc: "The Sisodia Ranas claim descent from the Sun itself and the seniority of the oldest surviving dynasty in India. Their word carries weight in every Rajput court."
 RJP_flying_club: "The Jodhpur Flying Club"
 RJP_flying_club_desc: "Maharaja Umaid Singh's aviators drill over the desert, turning a princely hobby into a professional air arm."
 RJP_gang_canal: "The Gang Canal"
 RJP_gang_canal_desc: "The waters of the Sutlej greened the northern Thar, and a granary now feeds our armies where once was only sand."

 RJP_chamber_of_princes: "Convene the Chamber of Princes"
 RJP_chamber_of_princes_desc: "Summon the rulers of Jaipur, Jodhpur, Bikaner and Udaipur to a common council of Rajputana."
 RJP_seniority_dispute: "The Question of Seniority"
 RJP_seniority_dispute_desc: "Mewar claims the seat of honour by ancient right; wealthy Jaipur and martial Bikaner press their own."
 RJP_rajput_war_council: "The Rajput War-Council"
 RJP_rajput_war_council_desc: "Bind the martial clans into a single war-council under the banner of Rajputana."
 RJP_purdah_reform: "The Purdah Reform"
 RJP_purdah_reform_desc: "The modernising rulers would loosen the old social order; the orthodox nobility resists."
 RJP_desert_doctrine: "Doctrine of the Desert"
 RJP_desert_doctrine_desc: "Codify the hard-won lessons of war in the sands of the Thar."
 RJP_risala_mechanised: "The Risala Rides Again"
 RJP_risala_mechanised_desc: "Expand Bikaner's camel corps into a mechanised desert-cavalry force."
 RJP_thar_war_school: "The Thar War School"
 RJP_thar_war_school_desc: "A school of desert manoeuvre trains officers for the open sands."
 RJP_merchant_capital: "Empower Merchant Capital"
 RJP_merchant_capital_desc: "Open the treasury of the state to the Marwari banking houses."
 RJP_hundi_network: "The Hundi Network"
 RJP_hundi_network_desc: "Harness the credit networks of the seths to finance industrial growth."
 RJP_gang_canal_works: "Extend the Gang Canal"
 RJP_gang_canal_works_desc: "Carry the waters of the Sutlej deeper into the Thar and settle the canal colonies."
 RJP_flying_club_focus: "The Jodhpur Flying Club"
 RJP_flying_club_focus_desc: "Turn the Maharaja's aviation passion into a princely air force."
 RJP_marwar_squadrons: "Squadrons over Marwar"
 RJP_marwar_squadrons_desc: "Raise trained fighter squadrons to patrol the skies of the desert kingdom."

 RJP_flav.1_t: "The Chamber of Princes"
 RJP_flav.1_d: "The rulers of Rajputana gather beneath the durbar canopy. For centuries these houses feuded as often as they fought common foes; now, with the subcontinent balkanised and every kingdom arming, the case for a common council of the martial clans has never been stronger. But no Rajput prince surrenders his sovereignty lightly."
 RJP_flav.1_a: "Summon the Chamber of Princes"
 RJP_flav.1_b: "Let each court keep its sovereignty"
 RJP_flav.2_t: "A Question of Precedence"
 RJP_flav.2_d: "No sooner is the council proposed than the old quarrel erupts. Mewar's Sisodias claim the seat of honour as the senior-most dynasty, keepers of Chittor and the memory of Haldighati. Bikaner points to its camel corps and its canal; Jaipur to its treasury. Who shall preside?"
 RJP_flav.2_a: "Grant Mewar the seat of honour"
 RJP_flav.2_b: "Elevate Bikaner's martial crown"
 RJP_flav.2_c: "A rotating presidency for all houses"
 RJP_flav.3_t: "The Shape of the Council"
 RJP_flav.3_d: "The princes have agreed to sit together. Now the character of the Confederation must be decided: shall it be a war-council of the sword, binding the fighting clans, or a chamber of ledgers, funded and steered by the merchant seths who already hold the kingdom's purse?"
 RJP_flav.3_a: "A war-council of the martial clans"
 RJP_flav.3_b: "A council of the merchant houses"
 RJP_flav.14_t: "The Seniority of Mewar"
 RJP_flav.14_d: "The Rana of Udaipur presses his case at every sitting: the House of the Sun bowed to no Mughal and no Delhi durbar, and it will not now sit below upstart houses. The other princes watch to see whether we will affirm the old order of precedence or level the council."
 RJP_flav.14_a: "Proclaim the primacy of the House of Mewar"
 RJP_flav.14_b: "Honour all the ancient houses as equals"
 RJP_flav.4_t: "The Ganga Risala Modernises"
 RJP_flav.4_d: "The Ganga Risala, Bikaner's camel corps, once rode to Egypt and China in the old wars. Its officers now argue over its future: lorries and armoured cars could carry the desert war further than any camel, but the beasts go where no engine can and cost the state far less to keep."
 RJP_flav.4_a: "Mechanise the corps into desert cavalry"
 RJP_flav.4_b: "Keep the traditional Ganga Risala"
 RJP_flav.5_t: "Trials in the Thar"
 RJP_flav.5_d: "The reorganised corps is put through manoeuvres in the deep desert, where the dunes swallow supply columns and the wells lie days apart. The reports arrive at last on the Maharaja's desk."
 RJP_flav.5_a: "The trials are a triumph"
 RJP_flav.5_b: "Costly, but the men learned hard lessons"
 RJP_flav.6_t: "Capital or Crown"
 RJP_flav.6_d: "The Marwari houses -- Birla, Bajaj, the Shekhawati seths -- have grown rich enough to finance the modernisation of the whole kingdom. But the thakurs and jagirdars warn that merchant money buys merchant power, and that a kingdom ruled by ledgers is no kingdom at all."
 RJP_flav.6_a: "Empower the Marwari merchant houses"
 RJP_flav.6_b: "Uphold the feudal jagirdari order"
 RJP_flav.7_t: "The Financiers' Bargain"
 RJP_flav.7_d: "The seths open their coffers, and mills and foundries rise across the desert almost overnight. But the old nobility mutters that the court now dances to the tune of the counting-house, and something of the old order is lost forever."
 RJP_flav.7_a: "Let the financiers build the future"
 RJP_flav.8_t: "The Feudal Compact"
 RJP_flav.8_d: "The Maharaja reaffirms the rights of the thakurs and jagirdars. In return, the great landholders answer the levy in full, bringing their retainers and their sowars to the state's banner as their ancestors always have."
 RJP_flav.8_a: "The thakurs answer the levy"
 RJP_flav.9_t: "The Jodhpur Air Arm"
 RJP_flav.9_d: "Maharaja Umaid Singh has flown since boyhood and founded the Jodhpur Flying Club with his own funds. He proposes now to make it the seed of a princely air force -- unheard of among the desert kingdoms. The treasury officials would rather the money went to the railways."
 RJP_flav.9_a: "Found the princely air arm"
 RJP_flav.9_b: "Pour the funds into railways instead"
 RJP_flav.10_t: "Wings over the Desert"
 RJP_flav.10_d: "The airfield at Jodhpur hums with activity. The question is what our small air arm should become: a corps of fighter squadrons to contest the desert skies, or a transport and liaison wing to bind the far-flung kingdom together."
 RJP_flav.10_a: "Raise fighter squadrons over Marwar"
 RJP_flav.10_b: "Build a transport and liaison wing"
 RJP_flav.11_t: "The Waters of the Sutlej"
 RJP_flav.11_d: "The Gang Canal turned the northern Thar green, but it draws from the Sutlej, and Punjab claims the headworks divert too much water from its own colonies. Envoys trade sharp words over the barrage. Water in the desert is worth more than gold."
 RJP_flav.11_a: "Seize the Sutlej waters by force"
 RJP_flav.11_b: "Negotiate a water treaty with Punjab"
 RJP_flav.11_c: "Extend the Gang Canal on our own soil"
 RJP_flav.12_t: "Harvest of the Canal Colonies"
 RJP_flav.12_d: "A season has passed since the canal works were extended. The fate of the new colonies -- and of the men who settled them -- now turns on the flow of the water and the mood of the sky."
 RJP_flav.12_a: "A bumper harvest greens the desert"
 RJP_flav.12_b: "Drought and disputes over the headworks"
 RJP_flav.13_t: "The Purdah Reform Crisis"
 RJP_flav.13_d: "The reforming rulers would open schools for girls and loosen the strictest customs of purdah, arguing a modern state cannot leave half its people behind. The orthodox nobility calls it an affront to dharma and the honour of the clans. The court is bitterly divided."
 RJP_flav.13_a: "Enact the modernising reforms"
 RJP_flav.13_b: "Defer to the orthodox nobility"
 RJP_flav.13_c: "Steer a cautious middle path"
