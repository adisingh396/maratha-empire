 # ===== Advisor / idea tokens =====
 MAR_mahadaji_chief: "Mahadaji Shinde"
 MAR_ahilyabai_advisor: "Ahilyabai Holkar"
 MAR_balaji_vishwanath_advisor: "Peshwa Balaji Vishwanath"
 MAR_gaekwad_advisor: "Sayajirao Gaekwad III"
 MAR_visvesvaraya_advisor: "Sir M. Visvesvaraya"
 MAR_visvesvaraya_theorist: "Sir M. Visvesvaraya"
 MAR_jamsetji_tata_advisor: "Jamsetji Tata"
 MAR_dorabji_tata_advisor: "Sir Dorabji Tata"
 MAR_jrd_tata_air: "J.R.D. Tata"
 MAR_tilak_advisor: "Bal Gangadhar Tilak"
 MAR_savarkar_advisor: "V.D. Savarkar"
 MAR_ambedkar_advisor: "Dr. B.R. Ambedkar"
 MAR_karve_advisor: "Dhondo Keshav Karve"

 # ===== National spirits / ideas =====
 MAR_confederacy_autonomy: "Confederacy of Autonomous Houses"
 MAR_confederacy_autonomy_desc: "Scindia, Holkar, Gaekwad and Bhonsle keep their durbars, their armies and their revenues. The bond is loyalty to the crown, not obedience to Pune. Stability is bought at the price of a slow central purse."
 MAR_pune_centralism: "Pune Centralism"
 MAR_pune_centralism_desc: "The Peshwa's clerks reach into every province. Taxes, levies and appointments flow through Shaniwarwada. A powerful state, but the great houses chafe under it."
 MAR_grand_council: "The Grand Council of Sardars"
 MAR_grand_council_desc: "A standing council seats every great house beside the Peshwa. Grievances are heard before they become revolts, and the confederacy governs itself with one voice."
 MAR_peshwa_supremacy: "Supremacy of the Peshwai"
 MAR_peshwa_supremacy_desc: "The Bhat Peshwas are the true sovereigns of the Marathas in all but name. The Brahmin bureaucracy of Pune commands the machinery of state."
 MAR_chhatrapati_restored: "The Chhatrapati Restored"
 MAR_chhatrapati_restored_desc: "The Bhonsle line is called back from ceremony to command. The martial classes rally to a king of Shivaji's blood, and the throne means war again."
 MAR_hindutva_vanguard: "The Hindutva Vanguard"
 MAR_hindutva_vanguard_desc: "Savarkar's doctrine forges a martial, unifying Hindu nation. Volunteers drill in every town and the state speaks with one saffron voice."
 MAR_reformist_republic: "The Reformist Republic"
 MAR_reformist_republic_desc: "Ambedkar's law and Karve's schools remake the Deccan. Caste barriers fall, the franchise widens, and learning becomes the engine of the state."
 MAR_mahadaji_drill: "Mahadaji's Drilled Brigades"
 MAR_mahadaji_drill_desc: "The de Boigne tradition lives on: European drill, cast artillery and disciplined infantry battalions. The Maratha host trains faster and holds firmer."
 MAR_angre_blue_water: "Angre's Blue-Water Fleet"
 MAR_angre_blue_water_desc: "The Sarkhel's banner flies again over a modern Konkan navy. From Bombay the Marathas contest the Arabian Sea as they once did the coast."
 MAR_tata_combine_1: "The Tata Combine"
 MAR_tata_combine_1_desc: "The first heat of Deccan steel is poured. Jamsetji's dream of an Indian industrial house takes solid form."
 MAR_tata_combine_2: "The Tata Industrial Combine"
 MAR_tata_combine_2_desc: "Steel, hydro-power and machine-tools bind together into a true combine. The Deccan's factories multiply."
 MAR_tata_combine_3: "The Tata Industrial Empire"
 MAR_tata_combine_3_desc: "Jamshedpur, the Western Ghats dams and the Bombay mills form an integrated industrial empire rivalling any in Asia."

 # ===== Focus: Confederacy vs Centralism =====
 MAR_grand_sardar_council: "Convene the Sardars"
 MAR_grand_sardar_council_desc: "Summon the heads of the great houses to Pune and settle, once and for all, where sovereignty in the Confederacy truly lies."
 MAR_devolution_charter: "Charter of Devolution"
 MAR_devolution_charter_desc: "Guarantee the ancient rights of the houses in writing. Let each ruler govern his own domain and answer to the crown only in war and coin."
 MAR_pune_supremacy: "Supremacy of Pune"
 MAR_pune_supremacy_desc: "Bind the houses to the Peshwa's administration. Their courts, revenues and armies shall serve one central will."
 MAR_federal_diet: "The Federal Diet"
 MAR_federal_diet_desc: "Seat the great houses in a permanent council of state. The Confederacy shall reason together and rule together."
 MAR_unitary_command: "Unitary Command"
 MAR_unitary_command_desc: "Fold the house armies into a single Maratha command. The drilled brigades of Pune will answer any defiance."
 MAR_proclaim_the_federation: "Proclaim the Maratha Federation"
 MAR_proclaim_the_federation_desc: "Whether by charter or by force, the Deccan is bound into one state. The banner of the Confederacy flies over a united realm."

 # ===== Focus: Hindutva vs Reformist =====
 MAR_great_debate: "The Great Debate"
 MAR_great_debate_desc: "Two currents contend for the soul of the Maratha state: Savarkar's martial Hindu nationalism and the reformist republicanism of Ambedkar and Karve."
 MAR_savarkar_doctrine: "The Savarkar Doctrine"
 MAR_savarkar_doctrine_desc: "Adopt Hindutva as the creed of the state. A unifying, martial identity binds the nation for the struggles ahead."
 MAR_ambedkar_constitution: "The Ambedkar Constitution"
 MAR_ambedkar_constitution_desc: "Enshrine equality before the law and a broad franchise. The republic rests on rights, not on caste or creed."
 MAR_hindu_martial_revival: "Hindu Martial Revival"
 MAR_hindu_martial_revival_desc: "Enlist the Sangathan volunteers and revive the akharas. A citizen-soldiery stands ready for the nation."
 MAR_secular_franchise: "The Secular Franchise"
 MAR_secular_franchise_desc: "Abolish untouchability and open the schools and colleges to all. A literate, enfranchised people is the strongest of states."

 # ===== Focus: Deccan Five-Year Plan =====
 MAR_deccan_five_year_plan: "The Deccan Five-Year Plan"
 MAR_deccan_five_year_plan_desc: "Charter Visvesvaraya's planning board and the Tata combine. The Deccan will industrialise on a plan, not by chance."
 MAR_tata_steel_foundries: "Tata Steel Foundries"
 MAR_tata_steel_foundries_desc: "Expand the Jamshedpur works into the largest steel plant in Asia. The combine forges the sinews of a modern power."
 MAR_western_ghats_hydro: "Western Ghats Hydro-Power"
 MAR_western_ghats_hydro_desc: "Dam the ghats and light the mills of Bombay and Pune with Deccan water. Cheap power completes the industrial empire."
 MAR_mahadaji_drill_reform: "The Drilled Army"
 MAR_mahadaji_drill_reform_desc: "Revive Mahadaji Shinde's European drill and artillery reforms. The host will march and shoot like the best in the world."
 MAR_angre_blue_water_fleet: "The Blue-Water Fleet"
 MAR_angre_blue_water_fleet_desc: "Rebuild the Angre naval tradition into a modern Arabian Sea fleet, built and based at Bombay."

 # ===== Events: Chain A — Confederacy vs Centralism =====
 MAR_flav.1_t: "The Question of the Confederacy"
 MAR_flav.1_d: "Two centuries after Shivaji raised the Bhagwa Dhwaj, the Maratha realm remains a confederacy of proud houses. Scindia rules Gwalior, Holkar Indore, Gaekwad Baroda, and the Bhonsle keep the Chhatrapati's ancient dignity. From Shaniwarwada the Peshwa's ministers ask a hard question: is this one nation, or a league of kings who happen to share a flag?"
 MAR_flav.1_a: "Summon the sardars to Pune"
 MAR_flav.1_b: "Let the houses keep their durbars"
 MAR_flav.2_t: "Gwalior Hesitates"
 MAR_flav.2_d: "The summons goes out under the Peshwa's seal. Indore and Baroda send their envoys; the Bhonsle send a courteous regret. But from Gwalior, Jivajirao Scindia — master of the finest artillery in the Deccan — sends no reply at all. The court holds its breath. To compel him is to risk a war among brothers; to ignore him is to admit that Pune commands nothing north of the Narmada."
 MAR_flav.2_a: "Scindia will answer, or be answered"
 MAR_flav.2_b: "Offer Gwalior a privy seat"
 MAR_flav.3_t: "The Defiance of the North"
 MAR_flav.3_d: "Scindia's reply, when it comes, is carried on the tongues of ten thousand horsemen mustering at Gwalior. He will treat with Pune as an equal or not at all. The drilled brigades of the Peshwa stand ready on the Godavari. One order will decide whether the Confederacy is welded into a state or shattered into fragments."
 MAR_flav.3_a: "March north — subjugate the houses"
 MAR_flav.3_b: "Grant the devolution they demand"
 MAR_flav.4_t: "A League of Kings"
 MAR_flav.4_d: "The houses have their autonomy, and with it a season of goodwill. Yet a confederacy without a common council is a rope of sand. The envoys of the great houses linger in Pune, and among them the idea grows: a standing diet where Scindia, Holkar and Gaekwad might sit as equals beside the Peshwa, and speak for the whole Deccan with one voice."
 MAR_flav.4_a: "Convene a permanent Federal Diet"
 MAR_flav.4_b: "Keep the confederacy loose"
 MAR_flav.5_t: "The Rising of the Sardars"
 MAR_flav.5_d: "It was only a matter of time. Feeling the Peshwa's grip tighten, the northern sardars have risen, and the old jealousies of Panipat's survivors boil over into open revolt. The drilled army waits on the order. The Peshwa may crush the rebellion and seize the rebel lands outright, or ride into their camps alone and dare them to strike a son of the Confederacy."
 MAR_flav.5_a: "Crush the revolt and claim their lands"
 MAR_flav.5_b: "Overawe them — no blood spilled"
 MAR_flav.6_t: "One Crown, Many Houses"
 MAR_flav.6_d: "The long argument is settled. Whether by the charter of a federal diet or by the discipline of a central army, the Deccan now moves as one. The Peshwa's ministers draft the proclamation: a Maratha Federation, gathering the ancient houses under a single sovereign banner, from the Konkan to the Chambal."
 MAR_flav.6_a: "Proclaim the Maratha Federation"
 MAR_flav.6_b: "Preserve the old confederacy"

 # ===== Events: Chain B — Peshwa vs Chhatrapati =====
 MAR_flav.10_t: "The Empty Throne at Satara"
 MAR_flav.10_d: "The Peshwas govern; the Chhatrapati reigns. For generations the Bhonsle king at Satara has been a sacred figurehead while the Brahmin ministers of Pune held the real power. Now the old wound reopens. The Maratha kshatriya nobles murmur that a Brahmin premier has usurped the seat of Shivaji himself. Where does legitimacy truly reside?"
 MAR_flav.10_a: "Uphold the Peshwa office"
 MAR_flav.10_b: "Restore the Chhatrapati to power"
 MAR_flav.11_t: "The Brahmin Ascendancy"
 MAR_flav.11_d: "The court affirms the Peshwai. The learned Chitpavan establishment — clerks, financiers and diplomats — closes ranks around Shaniwarwada, and the machinery of the state hums under their steady hands. Yet the kshatriya sardars watch coldly, and their loyalty must be tended, not assumed."
 MAR_flav.11_a: "Consolidate the Brahmin durbar"
 MAR_flav.11_b: "Placate the kshatriya nobles"
 MAR_flav.12_t: "A King Once More"
 MAR_flav.12_d: "The Bhonsle Chhatrapati is called from ceremony to command, and the martial classes of the Deccan rejoice. A king of Shivaji's blood sits again upon a throne with teeth. But a kingdom cannot be run from horseback alone — the question of who governs, day to day, remains."
 MAR_flav.12_a: "The King rallies the martial classes"
 MAR_flav.12_b: "A constitutional compromise"
 MAR_flav.13_t: "The Charter of Two Powers"
 MAR_flav.13_d: "King and Peshwa, throne and council — the compromise must be written down before it is tested by a crisis. The jurists of Pune draft a settlement in which the Chhatrapati reigns as the soul of the nation and the Peshwa governs as its hand."
 MAR_flav.13_a: "Codify the dual monarchy"
 MAR_flav.13_b: "Leave the balance to custom"

 # ===== Events: Chain C — Hindutva vs Reformist =====
 MAR_flav.20_t: "Two Visions of the Nation"
 MAR_flav.20_d: "In the coffee-houses of Pune and the presses of Bombay, a great argument rages over what the Maratha nation shall become. V.D. Savarkar preaches Hindutva — a unifying, martial Hindu identity to steel the state for a dangerous age. Against him stand Dr. Ambedkar and the aged reformer Dhondo Karve, who would build a republic of rights, schools and equal citizens. The Peshwa must choose the road."
 MAR_flav.20_a: "Savarkar's Hindutva vanguard"
 MAR_flav.20_b: "Ambedkar & Karve's reformist republic"
 MAR_flav.21_t: "The Volunteers Drill"
 MAR_flav.21_d: "Across the Deccan the Sangathan volunteers form their ranks, drilling with lathis and rifles in the dawn. Savarkar's movement is now a force in the land. The state may enlist these enthusiasts into its own battalions, or leave them as a disciplined party militia loyal first to the cause."
 MAR_flav.21_a: "Enlist the volunteers into the army"
 MAR_flav.21_b: "Keep them a party militia"
 MAR_flav.22_t: "The Republic of Equals"
 MAR_flav.22_d: "Ambedkar's pen and Karve's schools go to work upon the old order. A secular civil code is drafted, untouchability outlawed, and the doors of the colleges thrown open. The reactionaries grumble, but a literate and enfranchised Deccan is rising, and its strength is of a new kind."
 MAR_flav.22_a: "Pass the secular civil code"
 MAR_flav.22_b: "Fund colleges and scholarships"

 # ===== Events: Standalone flavor =====
 MAR_flav.30_t: "The Drilled Army of Mahadaji"
 MAR_flav.30_d: "The generals dust off the manuals of Mahadaji Shinde, who a century and a half ago hired the Savoyard de Boigne to raise European-drilled brigades and cast the Marathas' own artillery. The lesson was plain then and is plainer now: discipline and iron beat numbers. Shall the host be remade in that mould?"
 MAR_flav.30_a: "Hire drill-masters and cast our guns"
 MAR_flav.30_b: "Trust the silladar cavalry host"
 MAR_flav.31_t: "Angre's Blue-Water Dream"
 MAR_flav.31_d: "From the Konkan forts the old sailors still tell of Kanhoji Angre, the Sarkhel whose fleet no European navy could master. The Arabian Sea is open once more to any power bold enough to seize it. From the yards of Bombay, the Marathas could build a navy worthy of that memory — or count the cost and stay ashore."
 MAR_flav.31_a: "Build a modern Arabian Sea fleet"
 MAR_flav.31_b: "Keep the coast guard small"
 MAR_flav.32_t: "The First Heat of Steel"
 MAR_flav.32_d: "Jamsetji Tata dreamed of an Indian house of iron; his heirs would pour its steel across the Deccan. The furnaces of Jamshedpur stand ready for their charter. A native combine would free the nation from foreign forges — but it will demand capital, coal and the patience of the state."
 MAR_flav.32_a: "Charter the Tata combine"
 MAR_flav.32_b: "Court foreign capital instead"
 MAR_flav.33_t: "Wings Over the Deccan"
 MAR_flav.33_d: "J.R.D. Tata, the young airman, has flown the mail from Karachi to Bombay and dreams of a network of routes binding the subcontinent by air. The state might fold his airline into a national carrier and a nascent air arm — or leave him his private wings and quietly buy the benefit of his pioneering."
 MAR_flav.33_a: "Nationalize the air routes"
 MAR_flav.33_b: "Subsidize Tata's private airline"
 MAR_flav.34_t: "The Legacy of Ahilyabai"
 MAR_flav.34_d: "Across the Holkar lands and far beyond, the temples, ghats and rest-houses raised by Ahilyabai Holkar still stand as monuments to the temple-builder queen of Indore. Her memory is a bond stronger than any treaty. The state may invoke it to knit the Holkar domains closer, or honour it by tending the works she once endowed."
 MAR_flav.34_a: "Invoke her memory to unify Indore"
 MAR_flav.34_b: "Endow the ghats and rest-houses"
 MAR_flav.35_t: "The Engineer's Vision"
 MAR_flav.35_d: "Sir M. Visvesvaraya, the engineer who transformed Mysore, lays a Five-Year plan before the Pune durbar: dams and ironworks, railways and reservoirs, all knit into a single scheme of national development. It is a bold and costly design. The state may adopt the whole vision, or fund only the water and power works for now."
 MAR_flav.35_a: "Adopt the engineer's whole plan"
 MAR_flav.35_b: "Fund water and power works only"
