l_english:
 HYD_deccan_industry: "Deccan Industry"
 HYD_deccan_industry_desc: "Harness the Nizam's coalfields and mills to build a modern industrial base across the Deccan plateau."
 HYD_modern_nizam_forces: "Modernize the Nizam's Forces"
 HYD_modern_nizam_forces_desc: "Re-equip and retrain the Hyderabad State Forces into a professional standing army."
 HYD_french_advisors: "Foreign Military Advisors"
 HYD_french_advisors_desc: "Hire European instructors to drill the army in modern doctrine and gunnery."
 HYD_deccan_sultanate_proclaimed: "Proclaim the Deccan Sultanate"
 HYD_deccan_sultanate_proclaimed_desc: "Declare a sovereign Muslim empire of the Deccan under the Asaf Jahi crown."
 HYD_confront_maratha: "Confront the Marathas"
 HYD_confront_maratha_desc: "Challenge Pune's hegemony over the plateau and contest the southern heartland."
 HYD_alliance_or_war: "Alliance or War"
 HYD_alliance_or_war_desc: "Decide whether to bind the neighbouring courts by treaty or by the sword."
 HYD_pan_islamic_vision: "Pan-Islamic Vision"
 HYD_pan_islamic_vision_desc: "Position Hyderabad as the champion of Muslim polities across the subcontinent."
 HYD_indian_empire: "A Hyderabadi Empire"
 HYD_indian_empire_desc: "Turn the Nizam's wealth and arms toward dominion over the whole of India."
 HYD_world_colonize: "Overseas Ventures"
 HYD_world_colonize_desc: "Project Hyderabadi power and capital beyond the shores of the subcontinent."
 MYS_silk_industry: "The Silk Industry"
 MYS_silk_industry_desc: "Expand Mysore's famed silk and sandalwood trades into a modern export economy."
 MYS_karnataka_unite: "Unite Karnataka"
 MYS_karnataka_unite_desc: "Gather the Kannada-speaking lands under the Wadiyar throne."
 MYS_southern_empire: "A Southern Empire"
 MYS_southern_empire_desc: "Forge the peninsular south into a single dominion led from Mysore."
 MYS_dravidian_ties: "Dravidian Ties"
 MYS_dravidian_ties_desc: "Bind the Dravidian kingdoms of the south into a common cause."
 MYS_carnatic_empire: "The Carnatic Empire"
 MYS_carnatic_empire_desc: "Raise Mysore to mastery over the Carnatic coast and its riches."
 RJP_rajput_clans: "The Rajput Clans"
 RJP_rajput_clans_desc: "Rally the martial houses of Rajputana behind a single banner."
 RJP_desert_industry: "Desert Industry"
 RJP_desert_industry_desc: "Build workshops and arsenals in the arid heart of the Thar."
 RJP_cavalry_tradition: "Cavalry Tradition"
 RJP_cavalry_tradition_desc: "Preserve and modernize the storied horse and camel corps of the desert states."
 RJP_fortress_chittor: "The Fortress of Chittor"
 RJP_fortress_chittor_desc: "Invoke the defiant legacy of Mewar's great citadel to steel the nation's resolve."
 RJP_confederation: "The Rajput Confederation"
 RJP_confederation_desc: "Federate Jaipur, Jodhpur, Bikaner, and Udaipur into one war-council."
 RJP_alliance_game: "The Game of Alliances"
 RJP_alliance_game_desc: "Play the courts of India against one another to secure Rajputana's rise."
 RJP_claim_delhi: "Claim Delhi"
 RJP_claim_delhi_desc: "Press the Rajput claim to the imperial seat at Delhi."
 RJP_unify_rajputana_india: "Unify India under Rajputana"
 RJP_unify_rajputana_india_desc: "Carry the Rajput banner across the subcontinent to a single throne."
