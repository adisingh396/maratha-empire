l_english:
 ASM_purandar: "Swargadeo Purandar Singha"
 ASM_purandar_desc: "The last crowned Ahom king's heir — a throne waiting to be restored."
 ASM_phizo: "Angami Zapu Phizo"
 ASM_phizo_desc: "Founder of Naga nationalism; the hills answer to no valley crown."
 ASM_rabha: "Bishnu Prasad Rabha"
 ASM_rabha_desc: "The Kalaguru — revolutionary artist and voice of the Assamese peasantry."
 ASM_phukan: "Tarun Ram Phukan"
 ASM_phukan_desc: "Early Assam Congress leader and tireless organiser of the valley."
 ASM_raichoudhury: "Ambikagiri Raichoudhury"
 ASM_raichoudhury_desc: "The Assam Kesari — nationalist poet and firebrand of Assamese identity."
 ASM_agarwala: "Jyoti Prasad Agarwala"
 ASM_agarwala_desc: "Assam's first filmmaker and a leftist cultural icon."
 ASM_bezbaroa: "Lakshminath Bezbaroa"
 ASM_bezbaroa_desc: "The towering father of modern Assamese literature."
 ASM_maniram: "Maniram Dewan"
 ASM_maniram_desc: "Ahom noble and tea-planting pioneer, hanged for defying foreign rule."
 ASM_sukaphaa: "Sukaphaa"
 ASM_sukaphaa_desc: "The Tai founder whose dynasty ruled the Brahmaputra for six centuries."
 ASM_lachit: "Lachit Borphukan"
 ASM_lachit_desc: "The general who broke the Mughals at Saraighat — master of riverine war."
 ASM_gaidinliu: "Rani Gaidinliu"
 ASM_gaidinliu_desc: "The Naga priestess-rebel who led the hills in armed uprising."

 ASM_phizo_naga_voice: "Voice of the Naga Hills"
 ASM_phizo_naga_voice_desc: "Phizo channels hill grievances into an organised separatist movement."
 ASM_rabha_kalaguru: "The Kalaguru's Call"
 ASM_rabha_kalaguru_desc: "Rabha stirs the peasantry with revolutionary song and theatre."
 ASM_phukan_congress: "Congress Elder"
 ASM_phukan_congress_desc: "Phukan's patient organising binds the valley to the national cause."
 ASM_raichoudhury_kesari: "The Assam Kesari"
 ASM_raichoudhury_kesari_desc: "Raichoudhury's verse forges a proud Assamese self-consciousness."
 ASM_agarwala_jyoti: "Screen and Verse"
 ASM_agarwala_jyoti_desc: "Agarwala turns film and poetry into instruments of a modern Assam."
 ASM_bezbaroa_theorist: "Man of Letters"
 ASM_bezbaroa_theorist_desc: "Bezbaroa's literary authority lends the state cultural legitimacy."
 ASM_maniram_planter: "The Planter's Craft"
 ASM_maniram_planter_desc: "Maniram's mastery of tea builds an industrial garden economy."
 ASM_sukaphaa_founder: "The Founder's Mandate"
 ASM_sukaphaa_founder_desc: "Sukaphaa's memory sanctifies the six-century Ahom state."

 ASM_ahom_heritage: "Ahom Heritage"
 ASM_ahom_heritage_desc: "Six centuries of Tai-Ahom kingship — the Rang Ghar, the Saraighat legend, and the Swargadeo's mandate bind the valley together."
 ASM_digboi_concession: "The Digboi Concession"
 ASM_digboi_concession_desc: "Asia's first oilfield and refinery turn the Brahmaputra frontier into a petro-industrial prize."
 ASM_tea_planters: "The Tea Planters' Raj"
 ASM_tea_planters_desc: "The gardens, the auction houses and the planter clubs command Assam's wealth — and its labour."
 ASM_jungle_acclimatization: "Jungle Acclimatization"
 ASM_jungle_acclimatization_desc: "Soldiers hardened to monsoon forest and hill fight where outsiders wither."
 ASM_naga_tension: "The Naga Question"
 ASM_naga_tension_desc: "The hill peoples chafe under valley rule; every levy raised is a grievance sharpened."
 ASM_brahmaputra_logistics: "Brahmaputra Logistics"
 ASM_brahmaputra_logistics_desc: "The great river is Assam's highway — steamers, ferries and bridges knit the valley into one supply line."

 ASM_flav.1_t: "The Empty Throne of the Swargadeo"
 ASM_flav.1_d: "For six hundred years the Tai-Ahom kings ruled from Charaideo to the Naga foothills, until the dynasty fell in living memory. Now the valley's nobles debate whether to raise a new Swargadeo on Lachit Borphukan's imperishable legend — or to govern instead through a council of Borphukans, as the old kingdom often did in its dotage."
 ASM_flav.1_a: "Crown a Swargadeo on Lachit's legacy"
 ASM_flav.1_b: "Rule as a council of Borphukans"
 ASM_flav.2_t: "Rebuilding the Kingdom"
 ASM_flav.2_d: "A restored Ahom state needs more than a crown. The Kareng Ghar palace lies in ruins and the old Paik militia system — every able man owing service to the throne — has lapsed. Advisors press us to choose where the first coin and the first decree should fall."
 ASM_flav.2_a: "Rebuild the Kareng Ghar palace-court"
 ASM_flav.2_b: "Bind the Paiks to the new state"
 ASM_flav.3_t: "The Crown of Kamarupa"
 ASM_flav.3_d: "The old chronicles speak of Kamarupa, the ancient kingdom of the eastern Himalaya. Shall the Swargadeo proclaim himself its restored sovereign — an absolute Ahom monarch — or accept a throne bound by the Mel, the great council, ruling the river valley by consent?"
 ASM_flav.3_a: "Proclaim the Kamarupa crown restored"
 ASM_flav.3_b: "A constitutional Swargadeo, bound by the Mel"
 ASM_flav.4_t: "Black Gold of Digboi"
 ASM_flav.4_d: "\"Dig, boy, dig!\" — so the field got its name in 1889. The Assam Oil Company pumps crude from Asia's first refinery at Digboi, and the great foreign majors are circling with contracts and cash. We may sell them a rich concession for immediate wealth, or seize the wells for the nation and refine our own fuel."
 ASM_flav.4_a: "Grant the foreign majors a rich concession"
 ASM_flav.4_b: "Nationalise the Assam Oil Company"
 ASM_flav.5_t: "The Oil Question"
 ASM_flav.5_d: "The derricks pump day and night. The question now is where the crude flows — abroad, to buy the machine-tools Assam cannot make; or into our own tanks and boilers, feeding a war machine on the Burma frontier."
 ASM_flav.5_a: "Trade crude abroad for machine-tools"
 ASM_flav.5_b: "Refine at home for the war machine"
 ASM_flav.5_c: "Keep both markets open"
 ASM_flav.6_t: "The Pipeline or the Purse"
 ASM_flav.6_d: "Digboi's wealth can be reinvested or banked. Engineers propose a pipeline south to the Brahmaputra ferry-heads; the treasury proposes to hoard the royalties against the coming storm."
 ASM_flav.6_a: "Lay the Digboi-Brahmaputra pipeline"
 ASM_flav.6_b: "Bank the royalties as a war-chest"
 ASM_flav.7_t: "The Planters' Raj"
 ASM_flav.7_d: "Maniram Dewan first showed that Assam could grow tea to rival China — and paid for his defiance on the gallows. Today the planter clubs run a state within the state: indentured coolie lines, private railways, and export fortunes. Do we govern with the planters, or break their indenture and arm the labour lines?"
 ASM_flav.7_a: "Side with the planter clubs and export lords"
 ASM_flav.7_b: "Break the indenture, arm the coolie lines"
 ASM_flav.8_t: "Leaf and Labour"
 ASM_flav.8_d: "Whichever way the state has leaned, the tea economy must be organised. A cartel could corner the world auction and pour gold into the treasury; garden councils and a living wage could turn a million labourers into loyal subjects."
 ASM_flav.8_a: "A tea cartel to rule the auction"
 ASM_flav.8_b: "Garden councils and a living wage"
 ASM_flav.8_c: "Let the gardens and the lines settle it"
 ASM_flav.9_t: "Hills Against Plains"
 ASM_flav.9_d: "From Jadonang to Gaidinliu to Phizo, the Naga and hill peoples have risen against rule from the valley. We can grant the hills a self-governing council and win them by consent — or march the levies up the tracks and impose the valley's writ by force."
 ASM_flav.9_a: "Grant the hills a self-governing council"
 ASM_flav.9_b: "March the levies into the Naga tracts"
 ASM_flav.10_t: "The Shape of Assam"
 ASM_flav.10_d: "The hill question comes to a head. Either Assam becomes a federation of valley and hill, its peoples bound by mutual guarantee — or Phizo's separatism is crushed outright and the frontier held by the bayonet."
 ASM_flav.10_a: "A federated Assam of valley and hill"
 ASM_flav.10_b: "Crush Phizo's Naga separatism outright"
 ASM_flav.11_t: "The Grouping Crisis"
 ASM_flav.11_d: "The great eastern power presses for a grouping that would fold Assam into a Bengali-dominated bloc — swallowing our language, our tea revenues, and our oil. Bordoloi's men urge outright refusal; the pragmatists counsel bargaining for autonomy within a looser arrangement."
 ASM_flav.11_a: "Refuse absorption into greater Bengal"
 ASM_flav.11_b: "Bargain for autonomy within a loose group"
 ASM_flav.12_t: "The Frontier Stands"
 ASM_flav.12_d: "The die is cast. Either we fortify the Brahmaputra frontier and dare Bengal to enforce its grouping by arms — or we secure a treaty guaranteeing Assam's autonomy, and let the crisis pass without a shot."
 ASM_flav.12_a: "Fortify the frontier and dare Bengal to come"
 ASM_flav.12_b: "A guaranteed autonomy, sealed by treaty"

 ASM_swargadeo_throne: "The Empty Throne"
 ASM_swargadeo_throne_desc: "Reopen the question of the Ahom monarchy and set the valley's nobles to debate a restoration."
 ASM_ahom_council: "Council of Borphukans"
 ASM_ahom_council_desc: "Revive the old offices of the Ahom court to steady the restored state."
 ASM_paik_levy: "The Paik System"
 ASM_paik_levy_desc: "Restore the levy by which every able man owes service to the throne."
 ASM_kamarupa_restored: "Kamarupa Restored"
 ASM_kamarupa_restored_desc: "Proclaim the ancient kingdom reborn under a legitimate Swargadeo."
 ASM_digboi_derricks: "The Digboi Derricks"
 ASM_digboi_derricks_desc: "Expand the wells of Asia's first oilfield and open the concession question."
 ASM_foreign_majors: "Court the Foreign Majors"
 ASM_foreign_majors_desc: "Sell rich concessions to overseas oil companies for capital and technology."
 ASM_national_oil_board: "A National Oil Board"
 ASM_national_oil_board_desc: "Seize the Assam Oil Company and refine Assam's crude for Assam."
 ASM_digboi_pipeline: "The Digboi Pipeline"
 ASM_digboi_pipeline_desc: "Lay a pipeline from the wells to the Brahmaputra to move fuel and freight."
 ASM_planter_clubs: "The Planter Clubs"
 ASM_planter_clubs_desc: "Reckon with the tea oligarchy that commands Assam's wealth and labour."
 ASM_indenture_question: "The Indenture Question"
 ASM_indenture_question_desc: "Rule with the planters and their indentured labour lines."
 ASM_garden_councils: "Garden Councils"
 ASM_garden_councils_desc: "Break the indenture and organise the labourers into loyal garden councils."
 ASM_hill_autonomy: "The Hill Autonomy"
 ASM_hill_autonomy_desc: "Open the question of self-rule for the Naga and hill peoples."
 ASM_valley_centralism: "Writ of the Valley"
 ASM_valley_centralism_desc: "Impose the valley's authority over the restless hill tracts by force of levy."
