l_english:
 got_world_stage_category: "World Stage"
 got_secret_development_category: "Secret Development"
 got_seek_allies_membership: "Seek Allied Membership"
 got_seek_allies_membership_desc: "Open talks with the democratic powers. A seat among the Allies buys protection — and obligations."
 got_seek_axis_membership: "Seek Axis Membership"
 got_seek_axis_membership_desc: "Court the revisionist powers. Their patronage arms us fast, but binds us to their wars."
 got_seek_comintern_membership: "Seek Comintern Membership"
 got_seek_comintern_membership_desc: "Reach out to the international. Red gold and advisors, at the price of the old order."
 got_indian_league_faction: "Found the Indian League"
 got_indian_league_faction_desc: "Bind the kingdoms of the subcontinent into one bloc under our leadership, answerable to no foreign crown."
 got_intervene_foreign_war: "Intervene in a Foreign War"
 got_intervene_foreign_war_desc: "Send volunteers and materiel abroad to shape a distant conflict and win favour with the victors."
 got_indian_ocean_venture: "Indian Ocean Venture"
 got_indian_ocean_venture_desc: "Project our fleet across the ocean trade lanes, staking a claim to the sea our merchants once ruled."
 got_east_africa_trade_post: "East Africa Trade Post"
 got_east_africa_trade_post_desc: "Re-establish the old Gujarati and Konkani factories on the Swahili coast for resources and reach."
 got_southeast_asia_influence: "Southeast Asia Influence"
 got_southeast_asia_influence_desc: "Revive the Chola-era sphere across the Bay of Bengal through diplomacy, coin, and quiet pressure."
 got_secret_rearmament: "Secret Rearmament"
 got_secret_rearmament_desc: "Rearm behind a screen of civilian contracts. Powerful if hidden, dangerous if exposed."
 got_quiet_industrialization: "Quiet Industrialization"
 got_quiet_industrialization_desc: "Grow the industrial base without fanfare, drawing no alarm from watchful rivals."
 got_covert_alliance_network: "Covert Alliance Network"
 got_covert_alliance_network_desc: "Cultivate friendly courts across India before anyone realizes a bloc is forming."
 got_intervene_tt: "Sends volunteers and lend-lease to the chosen belligerent."
 got_league_tt: "Founds the Indian League faction under our leadership."
 got_ocean_venture_tt: "Grants a naval research boost and political capital."
 got_east_africa_tt: "Establishes an overseas trade post for resources and opinion."
 got_sea_influence_tt: "Extends our influence across Southeast Asia."
 got_secret_rearmament_tt: "Covertly builds military strength; risks discovery."
 got_quiet_ind_tt: "Adds industry quietly, avoiding rival attention."
 got_covert_network_tt: "Improves opinion with neighbouring Indian courts."

 MAR_got.1_title: "A Seat Among the Allies"
 MAR_got.1_desc: "The democratic powers welcome our overtures. Their guarantee shields us — so long as we honour the compact."
 MAR_got.1_a: "The compact is signed"
 MAR_got.2_title: "The Revisionist Embrace"
 MAR_got.2_desc: "The Axis courts are eager for a partner in the East. Their arsenals open to us; their wars will follow."
 MAR_got.2_a: "We march with them"
 MAR_got.3_title: "The International Extends a Hand"
 MAR_got.3_desc: "Red gold and advisors arrive. The old order grumbles, but the treasury does not."
 MAR_got.3_a: "Workers and princes united"
 MAR_got.4_title: "The Indian League Rises"
 MAR_got.4_desc: "Under our banner the kingdoms of the subcontinent stand as one bloc, answerable to no foreign crown."
 MAR_got.4_a: "One voice for India"
 MAR_got.5_title: "Volunteers Abroad"
 MAR_got.5_desc: "Our expeditionary volunteers ship out to a distant front. Victory there buys favour here."
 MAR_got.5_a: "Let them prove our steel"
 MAR_got.6_title: "Masters of the Ocean"
 MAR_got.6_desc: "Our ensigns range across the old trade lanes. The Indian Ocean remembers Indian sails."
 MAR_got.6_a: "The sea is ours again"
 MAR_got.7_title: "Factories on the Swahili Coast"
 MAR_got.7_desc: "The old Gujarati and Konkani trade posts reopen, feeding our industry with African goods."
 MAR_got.7_a: "Commerce revived"
 MAR_got.8_title: "The Bay of Bengal Sphere"
 MAR_got.8_desc: "From Ceylon to the Straits, courts and merchants lean our way once more."
 MAR_got.8_a: "The Chola sea returns"
 MAR_got.9_title: "Arms in the Shadows"
 MAR_got.9_desc: "Behind civilian contracts, our arsenals hum. Reveal the programme, or keep it hidden a while longer?"
 MAR_got.9_a: "Keep it quiet"
 MAR_got.9_b: "Reveal it and rally the nation"