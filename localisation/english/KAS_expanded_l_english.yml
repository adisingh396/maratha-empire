l_english:
 KAS_abbas:0 "Chaudhry Ghulam Abbas"
 KAS_gulab:0 "Maharaja Gulab Singh"
 KAS_kak:0 "Ramchandra Kak"
 KAS_bazaz:0 "Prem Nath Bazaz"
 KAS_mirwaiz:0 "Mirwaiz Yusuf Shah"
 KAS_karan:0 "Yuvraj Karan Singh"
 KAS_bakshigm:0 "Bakshi Ghulam Mohammad"
 KAS_ghansara:0 "Ghansara Singh"
 KAS_zorawar:0 "Zorawar Singh Kahluria"
 KAS_kak_counsel:0 "Ramchandra Kak"
 KAS_kak_counsel_desc:0 "As Prime Minister of the state, Kak counsels the Maharaja to keep Kashmir aloof from every faction and to answer to no crown but its own."
 KAS_bazaz_secular:0 "Prem Nath Bazaz"
 KAS_bazaz_secular_desc:0 "A Pandit journalist who preaches Hindu-Muslim unity, Bazaz argues that Kashmir's future lies in a shared, secular Kashmiriyat rather than communal camps."
 KAS_mirwaiz_cleric:0 "Mirwaiz Yusuf Shah"
 KAS_mirwaiz_cleric_desc:0 "The chief cleric of Srinagar commands the mosques of the Valley and the loyalty of the Muslim Conference bloc that opposes the National Conference."
 KAS_karan_heir:0 "Yuvraj Karan Singh"
 KAS_karan_heir_desc:0 "The young heir to the Dogra throne, groomed as the dynasty's future and a symbol of continuity for the House of Jamwal."
 KAS_bakshigm_hc:0 "Bakshi Ghulam Mohammad"
 KAS_bakshigm_hc_desc:0 "Abdullah's tireless organiser and strongman, Bakshi drills the militia of the National Conference into a disciplined political army."
 KAS_ghansara_hc:0 "Ghansara Singh"
 KAS_ghansara_hc_desc:0 "The Dogra Governor of Gilgit, tasked with holding the far northern frontier and the fractious Gilgit Scouts."

 KAS_flav.1_t:0 "The Switzerland of Asia"
 KAS_flav.1_d:0 "Ringed by the highest mountains on earth and coveted by every power on the plains, Kashmir need bow to none of them. Maharaja Hari Singh dreams of a neutral Himalayan kingdom that plays the great courts against one another and answers only to Srinagar. But neutrality must be armed, or it is merely an invitation."
 KAS_flav.1_a:0 "Trade our shawls to all, bind ourselves to none"
 KAS_flav.1_b:0 "A neutral crown must be a soldier's crown"
 KAS_flav.2_t:0 "Standing Alone"
 KAS_flav.2_d:0 "The powers press for accession, each dangling guarantees and threats. Kak advises the durbar that the passes themselves are our best diplomacy: hold the heights and let the plains bicker below."
 KAS_flav.2_a:0 "Fortify every pass and gorge"
 KAS_flav.2_b:0 "Cultivate the Maratha court as a distant patron"
 KAS_flav.3_t:0 "Naya Kashmir"
 KAS_flav.3_d:0 "Sheikh Abdullah's National Conference unfurls the 'Naya Kashmir' manifesto: land to the tiller, votes for women, an end to Dogra autocracy. The Valley stirs. The Lion of Kashmir asks whether the durbar will reform, or be swept aside."
 KAS_flav.3_a:0 "Embrace the manifesto — a people's Kashmir"
 KAS_flav.3_b:0 "The throne will not be dictated to by agitators"
 KAS_flav.4_t:0 "The Lion and the Crown"
 KAS_flav.4_d:0 "Reform or repression — either way the old order cannot stand still. The peasantry and the palace guard both wait to see which way the wind from Srinagar blows."
 KAS_flav.4_a:0 "Enlist the tillers into a new order"
 KAS_flav.4_b:0 "Reward the loyal State Forces"
 KAS_flav.5_t:0 "The Gilgit Scouts Stir"
 KAS_flav.5_d:0 "On the roof of the world, the Gilgit Scouts grow restless under a Dogra governor they never chose. Whispers run through the Karakoram that the frontier might raise its own banner. Ghansara Singh writes to Srinagar begging for orders."
 KAS_flav.5_a:0 "Win the Scouts with pay and honour"
 KAS_flav.5_b:0 "Crush any talk of secession"
 KAS_flav.6_t:0 "The Roof of the World"
 KAS_flav.6_d:0 "Whether by loyalty or by force, the northern agencies must be settled before the snows close the passes. Gilgit and Baltistan are too vast and too remote to be governed by half-measures."
 KAS_flav.6_a:0 "Raise frontier levies from the mountain clans"
 KAS_flav.6_b:0 "Bind the agencies with roads and rupees"
 KAS_flav.7_t:0 "Zorawar's Heirs"
 KAS_flav.7_d:0 "A century ago General Zorawar Singh led the Dogra colours over the Himalaya into Ladakh, Baltistan, and the tableland of Tibet itself. The old campaign maps still hang in the Jammu armoury. Might the modern State Forces walk again in the footsteps of the Napoleon of the Mountains?"
 KAS_flav.7_a:0 "Train an army for the high passes"
 KAS_flav.7_b:0 "Zorawar's glory is legend, not a plan"
 KAS_flav.8_t:0 "Over the High Passes"
 KAS_flav.8_d:0 "The mountain divisions are drilled and acclimatised. Beyond the Karakoram lie the trade routes and monasteries that once paid tribute to the Dogra throne. The staff awaits the Maharaja's word."
 KAS_flav.8_a:0 "March — reclaim the old conquests"
 KAS_flav.8_b:0 "Hold the heights; let the frontier be our wall"
 KAS_flav.9_t:0 "The Fracture of 1931"
 KAS_flav.9_d:0 "On the thirteenth of July the Valley erupts against Dogra rule; the jails fill and the streets of Srinagar run with grief. Kashmir is four peoples in one crown — Dogra Jammu, the Muslim Valley, Buddhist Ladakh, and the Gilgit marches. Which Kashmir shall the durbar choose to rule?"
 KAS_flav.9_a:0 "Answer the rising with steel"
 KAS_flav.9_b:0 "Open the durbar to all four peoples"
 KAS_flav.10_t:0 "The Iron Hand"
 KAS_flav.10_d:0 "Martial law grips the Valley. Order is restored at the point of the bayonet, but the wound between palace and people festers deeper than before."
 KAS_flav.10_a:0 "Rule the Valley through the garrison"
 KAS_flav.10_b:0 "Conscript the loyal Jammu districts"
 KAS_flav.11_t:0 "A Kashmir for All"
 KAS_flav.11_d:0 "The Praja Sabha is widened; Pandit, Muslim, Buddhist and Dogra sit together, warily, under one roof. It is fragile, but it is a beginning worth defending."
 KAS_flav.11_a:0 "Enshrine reform as the law of the land"
 KAS_flav.11_b:0 "Bind the four peoples through common trade"

 KAS_swiss_of_asia:0 "The Switzerland of Asia"
 KAS_swiss_of_asia_desc:0 "Let the mountains be our moat. Kashmir will stand neutral and armed, courted by all and owned by none."
 KAS_play_the_powers:0 "Play the Powers"
 KAS_play_the_powers_desc:0 "Our pashmina reaches every court from Pune to the passes of Central Asia. Trade with all, and let their rivalry be our shield."
 KAS_arm_the_state_forces:0 "Arm the State Forces"
 KAS_arm_the_state_forces_desc:0 "A neutral crown must be a soldier's crown. Re-equip and drill the Dogra State Forces for the defence of the passes."
 KAS_perpetual_neutrality:0 "Perpetual Neutrality"
 KAS_perpetual_neutrality_desc:0 "Kashmir declares itself the perpetual neutral of the Himalaya — a fortress kingdom that will fight only to remain itself."
 KAS_naya_kashmir:0 "Naya Kashmir"
 KAS_naya_kashmir_desc:0 "Land to the tiller, votes for women, dignity for the peasant. Sheikh Abdullah's manifesto becomes the charter of a new Kashmir."
 KAS_land_to_the_tiller:0 "Land to the Tiller"
 KAS_land_to_the_tiller_desc:0 "Break the jagirs and hand the terraced fields to those who work them. A landed peasantry is a loyal peasantry."
 KAS_peoples_militia:0 "The People's Militia"
 KAS_peoples_militia_desc:0 "Bakshi's cadres become a militia of the Valley — the muscle of the National Conference and the shield of the revolution."
 KAS_sher_e_kashmir:0 "Sher-e-Kashmir"
 KAS_sher_e_kashmir_desc:0 "The Lion of Kashmir stands supreme. The Dogra autocracy is swept aside for a socialist Kashmiri state."
 KAS_zorawars_heirs:0 "Zorawar's Heirs"
 KAS_zorawars_heirs_desc:0 "Recall the Napoleon of the Mountains, who carried the Dogra colours to Tibet. His heirs shall march again."
 KAS_mountain_divisions:0 "Mountain Divisions"
 KAS_mountain_divisions_desc:0 "Doctrine written for ice and altitude. Our divisions will move where lowland armies cannot breathe."
 KAS_march_on_tibet:0 "The March on the Heights"
 KAS_march_on_tibet_desc:0 "The passes are open and the divisions are ready. Reclaim the old Dogra conquests of the high plateau."
 KAS_communal_question:0 "The Communal Question"
 KAS_communal_question_desc:0 "Four peoples, one crown. The fractures of the durbar can no longer be ignored — they must be governed, one way or another."
 KAS_dogra_supremacy:0 "Dogra Supremacy"
 KAS_dogra_supremacy_desc:0 "The Jamwal throne rules by right of conquest. The patchwork will be held together by the mailed fist of Jammu."
 KAS_composite_kashmir:0 "A Composite Kashmir"
 KAS_composite_kashmir_desc:0 "Kashmiriyat above communion. Pandit, Muslim, Buddhist and Dogra shall share one durbar and one destiny."

 KAS_dogra_state_forces:0 "Dogra State Forces"
 KAS_dogra_state_forces_desc:0 "The hereditary army of the Jamwal crown, drawn from the martial districts of Jammu and drilled for the defence of the mountains."
 KAS_himalayan_fortress:0 "Himalayan Fortress"
 KAS_himalayan_fortress_desc:0 "The highest wall on earth defends our frontier. Every pass is a gate that a handful may hold against a host."
 KAS_pashmina_trade:0 "The Pashmina Trade"
 KAS_pashmina_trade_desc:0 "Kashmiri shawls and pashmina command princely prices from the plains to the courts of Central Asia, filling the treasury and binding foreign friends."
 KAS_naya_kashmir_reform:0 "Naya Kashmir Reform"
 KAS_naya_kashmir_reform_desc:0 "Land redistribution, mass literacy and the enfranchisement of the peasant have made the state and the people one."
 KAS_gilgit_scouts_idea:0 "The Gilgit Scouts"
 KAS_gilgit_scouts_idea_desc:0 "Hardy irregulars bred to the thin air of the Karakoram, unmatched in the highest and coldest terrain on earth."
 KAS_four_way_patchwork:0 "Four-Way Patchwork"
 KAS_four_way_patchwork_desc:0 "Dogra Jammu, the Muslim Valley, Buddhist Ladakh and the Gilgit marches pull in four directions. The crown governs a kingdom that barely coheres."
