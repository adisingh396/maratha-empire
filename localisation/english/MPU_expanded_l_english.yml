 MPU_irabot: "Hijam Irabot Singh"
 MPU_gambhir: "Maharaja Gambhir Singh"
 MPU_tikendrajit: "Bir Tikendrajit Singh"
 MPU_paona: "Paona Brajabashi"
 MPU_shaukat: "Col. Shaukat Ali Malik"
 MPU_bhagyachandra: "Maharaja Bhagyachandra"
 MPU_anganghal: "Hijam Anganghal Singh"

 MPU_irabot_red: "Voice of the Peasants"
 MPU_bhagya_culture: "Patron of the Ras Lila"
 MPU_anganghal_poet: "Bard of Khamba-Thoibi"

 MPU_ningthouja_legitimacy: "Ningthouja Legitimacy"
 MPU_ningthouja_legitimacy_desc: "The Ningthouja dynasty has ruled the valley of Kangleipak since the age of Nongda Lairen Pakhangba. The blood of the dragon-king lends the crown an authority no rival can match."
 MPU_sanamahi_revival: "Sanamahi Revival"
 MPU_sanamahi_revival_desc: "The old gods of the hearth and household are worshipped once more. The forced conversions of the Vaishnavite kings are undone, and the people rediscover their ancestral faith and the Meitei Mayek script."
 MPU_nupi_lan_power: "Legacy of the Nupi Lan"
 MPU_nupi_lan_power_desc: "The women of the Ima Keithel marched against rice profiteers and won. Their organised strength now anchors the economy and swells the ranks of the state."
 MPU_kangla_fort: "Bastion of Kangla"
 MPU_kangla_fort_desc: "The sacred fort at the heart of Imphal is restored and garrisoned. Behind its walls the kingdom digs in and defies any invader."
 MPU_jungle_frontier_infantry: "Jungle Frontier Infantry"
 MPU_jungle_frontier_infantry_desc: "Trained in the teak and bamboo of the eastern hills, our soldiers move where others cannot and live off a land that starves foreign armies."
 MPU_kabaw_valley_claim: "The Kabaw Valley Claim"
 MPU_kabaw_valley_claim_desc: "The fertile Kabaw Valley was surrendered to Burma in 1834. Manipur has never forgotten it, and the drums of irredentism beat toward the east."

 MPU_ningthouja_revival: "Revive the Ningthouja Dynasty"
 MPU_ningthouja_revival_desc: "Proclaim the ancient Meitei monarchy restored in full sovereignty, tracing our line to Pakhangba himself."
 MPU_pakhangba_throne: "The Throne of Pakhangba"
 MPU_pakhangba_throne_desc: "Enshrine the dragon-serpent Pakhangba as the divine sanction of the crown and bind the salais to the throne."
 MPU_kangla_coronation: "Coronation at Kangla"
 MPU_kangla_coronation_desc: "Hold the great coronation within the restored walls of Kangla Fort, the sacred seat of Meitei kingship."
 MPU_faith_question: "The Question of Faith"
 MPU_faith_question_desc: "Two centuries of Gaudiya Vaishnavism sit uneasily atop the older Sanamahi worship. The court must choose which gods the kingdom will serve."
 MPU_sanamahi_path: "Restore the Sanamahi Gods"
 MPU_sanamahi_path_desc: "Turn back to the indigenous faith of the Meitei — the household deity Sanamahi, the lai haraoba, and the Meitei Mayek script."
 MPU_vaishnavite_path: "Uphold the Vaishnavite Court"
 MPU_vaishnavite_path_desc: "Keep the Ras Lila, the Govindajee temple, and the Vaishnavite bond that ties us to the wider Hindu world of the Confederacy."
 MPU_meitei_mayek: "The Meitei Mayek Revival"
 MPU_meitei_mayek_desc: "Whichever gods we serve, the ancient script of the Meitei is taught in every school, reviving a literate national identity."
 MPU_nupi_lan_mobilise: "Mobilise the Ima Keithel"
 MPU_nupi_lan_mobilise_desc: "Harness the organised women of the great mother's market, whose war upon the rice merchants shook the kingdom."
 MPU_jungle_doctrine: "Doctrine of the Hills"
 MPU_jungle_doctrine_desc: "Codify the frontier fighting that has held the eastern hills for generations into a modern jungle-warfare doctrine."
 MPU_frontier_stockades: "Frontier Stockades"
 MPU_frontier_stockades_desc: "Ring the eastern approaches with fortified stockades, turning the jungle passes into a wall of fire."
 MPU_kabaw_claim: "Reclaim the Kabaw Valley"
 MPU_kabaw_claim_desc: "Press the ancient claim to the Kabaw Valley, lost to Burma a century ago, and rally the nation to its recovery."
 MPU_march_east: "March to the Chindwin"
 MPU_march_east_desc: "Mass the levies of the valley and the hills for a campaign east across the frontier toward the Chindwin."

 MPU_flav.1_t: "Kangleipak Restored"
 MPU_flav.1_d: "The elders of the seven salais gather at the Kangla and proclaim what has been whispered for a generation: the kingdom of Kangleipak stands sovereign once more. The dragon banner of Pakhangba flies over Imphal, and the whole valley waits to see what manner of king we shall be."
 MPU_flav.1_a: "A crown above all — proclaim the monarchy"
 MPU_flav.1_b: "A king who fights — rally the levies"
 MPU_flav.2_t: "The Salais Swear Fealty"
 MPU_flav.2_d: "The chiefs of the seven clans come before the throne. Some kneel gladly; others must be reminded where power now resides. The old federal jealousies of the salais can either be bound into loyalty or crushed into submission."
 MPU_flav.2_a: "Bind them with legitimacy and honour"
 MPU_flav.2_b: "Buy their loyalty with concessions"
 MPU_flav.3_t: "The Cross-River Gods"
 MPU_flav.3_d: "For two hundred years the kings of Manipur have worshipped Vishnu across the river, while the household still keeps Sanamahi's lamp burning in the corner. The priests demand a ruling: shall the state honour the imported faith, or the gods of our ancestors?"
 MPU_flav.3_a: "Restore Sanamahi and the old ways"
 MPU_flav.3_b: "Uphold the Vaishnavite settlement"
 MPU_flav.4_t: "The Lai Haraoba Returns"
 MPU_flav.4_d: "In villages across the valley the lai haraoba — the pleasing of the gods — is danced openly for the first time in living memory. The maibas and maibis reclaim their place. Some call it a national awakening; the Brahmin priests call it apostasy."
 MPU_flav.4_a: "Let the old festival flourish"
 MPU_flav.4_b: "Temper the revival to keep the peace"
 MPU_flav.5_t: "Nupi Lan — the Women's War"
 MPU_flav.5_d: "The women of the Ima Keithel rise as they did before, blocking the rice carts bound for export while their own children go hungry. Hijam Irabot Singh stands among them, turning a market riot into a movement. The palace must answer the marching mothers of Manipur."
 MPU_flav.5_a: "Bend to the women — reform the rice trade"
 MPU_flav.5_b: "Hold the export contracts firm"
 MPU_flav.6_t: "Irabot's Red Dawn"
 MPU_flav.6_d: "Hijam Irabot has carried the Nupi Lan into open politics, welding the peasants and the market women into a Praja Mandal that speaks of land, of rice, and of revolution. The valley has never heard such words from its own sons."
 MPU_flav.6_a: "Ride the red tide"
 MPU_flav.6_b: "Co-opt the movement's grievances"
 MPU_flav.7_t: "The Kabaw Valley Question"
 MPU_flav.7_d: "The maps in the palace archive still show the Kabaw Valley as Manipuri land, surrendered to the Burmese court in 1834. The ryots of the eastern marches send petitions; the war party sends memoranda. The lost valley calls."
 MPU_flav.7_a: "Press the ancient claim"
 MPU_flav.7_b: "Let old wounds heal — seek trade instead"
 MPU_flav.8_t: "Drums Toward the Chindwin"
 MPU_flav.8_d: "The levies of the valley and the hill militias gather at the frontier posts. Beyond the passes lies the Kabaw Valley and the road to the Chindwin. The Manipur Levy that Gambhir Singh once led rides again in spirit."
 MPU_flav.8_a: "March east to reclaim the valley"
 MPU_flav.8_b: "Fortify the frontier and wait"
 MPU_flav.9_t: "The Imphal Corridor"
 MPU_flav.9_d: "Great powers eye the road through Imphal as the gateway between India and Burma. Whoever holds the Manipur valley holds the door to the east. Armies far larger than ours will one day fight for this ground — better we shape that fight than be trampled by it."
 MPU_flav.9_a: "Make Manipur the pivot of the war"
 MPU_flav.9_b: "Guard our neutrality behind the hills"
 MPU_flav.10_t: "The Flag at Moirang"
 MPU_flav.10_d: "At Moirang the tricolour of a free India is raised on Manipuri soil, and Colonel Shaukat Ali Malik salutes it beneath the palm trees. Whether omen or opportunity, the moment binds our little kingdom to the great convulsion sweeping Asia."
 MPU_flav.10_a: "Throw in with the eastern coalition"
 MPU_flav.10_b: "Keep our own counsel and our own crown"
