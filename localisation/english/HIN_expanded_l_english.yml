 HIN_nawabi_legitimacy: "Nawabi Legitimacy"
 HIN_nawabi_legitimacy_desc: "The Nishapuri throne of Awadh, unbroken by any foreign annexation, commands the loyalty of court, clergy and countryside. The durbar at Lucknow lends the state a dynastic legitimacy that no republic could rival."
 HIN_taluqdar_levies: "Taluqdar Levies"
 HIN_taluqdar_levies_desc: "The great landed magnates of the Gangetic estates raise their own retainers and horsemen. Their private levies swell the muster rolls, but the crown's writ ends where the taluqdar's hospitality begins."
 HIN_1857_legacy: "The 1857 Legacy"
 HIN_1857_legacy_desc: "The memory of the Great Rebellion is a living creed in Awadh. From Bithoor to the Residency, every regiment marches under the shadow of a war left unfinished, and the soldiery burns for its completion."
 HIN_gangetic_multitudes: "Gangetic Multitudes"
 HIN_gangetic_multitudes_desc: "The Doab and the plains between the Ganga and the Yamuna are the most densely peopled land in the subcontinent. From this vast reservoir of cultivators the federation draws an inexhaustible manpower."
 HIN_aligarh_modernism: "Aligarh Modernism"
 HIN_aligarh_modernism_desc: "Sir Syed's college at Aligarh has bent the old Muslim gentry toward the sciences and the modern administration. The laboratories and law faculties quicken the state's learning, though the ulema grumble."
 HIN_banaras_revivalism: "Banaras Revivalism"
 HIN_banaras_revivalism_desc: "Malaviya's Hindu University at Banaras kindles a revivalist fervour along the ghats of the holy city. The state gains a fired-up martial spirit, at the price of straining the Ganga-Jamuni concord."
 HIN_flav.1_t: "The Restored Wali of Awadh"
 HIN_flav.1_d: "With no British bayonets to depose the Nishapuri line, the court of Lucknow proclaims the Wali of Awadh sovereign in his own right. The Bara Imambara is illuminated, the Kathak dancers perform, and the old nawabi order stands renewed. But a throne is only as strong as the army and treasury behind it."
 HIN_flav.1_a: "Enthrone the dynasty in full ceremony"
 HIN_flav.1_b: "A crown must rest on soldiers, not thumri"
 HIN_flav.2_t: "Rebuilding the Disbanded Army"
 HIN_flav.2_d: "The army of Awadh was dissolved a lifetime ago. Now the durbar must decide how to raise a new one: state arsenals under royal pay, or a call to the taluqdars to bring their own men to the colours."
 HIN_flav.2_a: "Found royal arsenals and a standing army"
 HIN_flav.2_b: "Summon the taluqdars and their levies"
 HIN_flav.3_t: "The Wali Among the Kingdoms"
 HIN_flav.3_d: "Ambassadors arrive from Pune and the other Indian courts. The Wali of Awadh must find his place among the balkanized kingdoms of Bharat: a dignified partner in the concert of thrones, or a rival who intends to gather them all."
 HIN_flav.3_a: "Take our seat among the courts of India"
 HIN_flav.3_b: "Lucknow, not Pune, shall lead Bharat"
 HIN_flav.4_t: "The Taluqdar Confederation"
 HIN_flav.4_d: "The barons of the Gangetic estates gather at Lucknow. They will pledge their horsemen and their harvests to the federation, but only as a confederation of equals under the crown, each master in his own domain. The centralizers at court warn that such a bargain hollows out the state."
 HIN_flav.4_a: "Accept the confederation of magnates"
 HIN_flav.4_b: "Break the magnates and centralize the realm"
 HIN_flav.5_t: "The Barons in Arms"
 HIN_flav.5_d: "The taluqdars have delivered their levies, and the muster fields overflow. Yet each baron commands his own men, and some speak more of their estates than of the federation. The court must choose whether to ride this feudal tide or to tame it."
 HIN_flav.5_a: "Let the barons lead their own contingents"
 HIN_flav.5_b: "Fold the levies into the royal army"
 HIN_flav.6_t: "The Centralized Reform"
 HIN_flav.6_d: "Having curbed the magnates, the crown extends its administration across the Doab. Revenue clerks and district officers replace the old estate stewards. The reform can be spent on roads and canals, or on a rapid new conscription."
 HIN_flav.6_a: "Build the infrastructure of a modern state"
 HIN_flav.6_b: "Levy a modern conscription at once"
 HIN_flav.7_t: "The 1857 Legacy Rising"
 HIN_flav.7_d: "In the bazaars and cantonments the old cry is heard again: the rebellion of 1857 was never a defeat, only an interruption. Veterans' sons and the taluqdar horsemen clamour to complete the war their grandfathers began. The court may harness this fervour or let it cool."
 HIN_flav.7_a: "Kindle the fire of the Great Rebellion"
 HIN_flav.7_b: "Honour the dead, but keep the peace"
 HIN_flav.8_t: "The Arsenal of Revolt"
 HIN_flav.8_d: "The rising demands weapons. Hidden magazines from the days of the Mutiny are reopened; smiths in Cawnpore and Lucknow work through the night. Shall the effort go to training a disciplined revanchist corps, or to arming the countless volunteers pouring in?"
 HIN_flav.8_a: "Forge a disciplined war-corps"
 HIN_flav.8_b: "Arm the volunteers en masse"
 HIN_flav.9_t: "The War of Completion"
 HIN_flav.9_d: "The moment has come. The soldiery of Awadh, drilled and inflamed, looks toward the Maratha hegemon that inherited what the rebels of 1857 fought to overturn. The Wali must decide: unleash the war of completion, or turn this energy inward to the throne."
 HIN_flav.9_a: "March to finish the work of 1857"
 HIN_flav.9_b: "Consolidate the throne instead"
 HIN_flav.10_t: "The Revolutionary Underground"
 HIN_flav.10_d: "Cells of the old Kakori conspirators and the Hindustan Socialist Republican Association survive in the alleys of Cawnpore and Allahabad. They offer the state a network of dedicated militants — or a threat to be crushed before it grows."
 HIN_flav.10_a: "Quietly cultivate the revolutionaries"
 HIN_flav.10_b: "Suppress the conspiracy in its cradle"
 HIN_flav.11_t: "The Red Tide Rises"
 HIN_flav.11_d: "The underground has grown into a movement. Red flags appear at the mill gates of Cawnpore; the Kisan Sabha marches with the workers. The revolutionaries press for a decisive turn to the left, and the court trembles at the choice."
 HIN_flav.11_a: "Ride the workers' and peasants' tide"
 HIN_flav.11_b: "Rein in the movement before it consumes us"
 HIN_flav.12_t: "The Gangetic Commune"
 HIN_flav.12_d: "The revolutionary underground has surfaced into open power. The socialists of Narendra Deva and the veterans of Azad's circle stand ready to remake Awadh as a workers' and peasants' republic. The old durbar's hour has struck."
 HIN_flav.12_a: "Proclaim the Gangetic workers' republic"
 HIN_flav.12_b: "Save the federation from the red flood"
 HIN_flav.13_t: "Aligarh or Banaras"
 HIN_flav.13_d: "Two universities contend for the soul of the Gangetic plain. At Aligarh, Sir Syed's heirs preach science and modern administration. At Banaras, Malaviya's revivalists preach a Hindu renaissance. Between them lies the syncretic Ganga-Jamuni middle path. The federation must choose its temper."
 HIN_flav.13_a: "Follow the modernists of Aligarh"
 HIN_flav.13_b: "Follow the revivalists of Banaras"
 HIN_flav.13_c: "Hold the syncretic Ganga-Jamuni path"
 HIN_flav.14_t: "The Federation Endures"
 HIN_flav.14_d: "The culture-war has been resolved, and the Ganga Federation settles into its chosen character. Whether tempered by the sciences of Aligarh or the fervour of Banaras, Lucknow must now turn its face outward to the wider concert of Indian kingdoms."
 HIN_flav.14_a: "Seek concord with the courts of India"
 HIN_flav.14_b: "Raise fresh regiments for the reckoning"
 HIN_restored_wali: "The Restored Wali of Awadh"
 HIN_restored_wali_desc: "Proclaim the sovereign Nishapuri throne of Awadh and cloak the state in dynastic legitimacy."
 HIN_awadh_army_rebuild: "Rebuild the Awadh Army"
 HIN_awadh_army_rebuild_desc: "Raise a new standing army to replace the force disbanded a lifetime ago."
 HIN_taluqdar_confederation: "The Taluqdar Confederation"
 HIN_taluqdar_confederation_desc: "Bind the great landed magnates into a feudal military federation under the crown."
 HIN_centralize_awadh: "Centralize the Realm"
 HIN_centralize_awadh_desc: "Break the power of the magnates and extend a modern royal administration across the Doab."
 HIN_gangetic_levy: "The Gangetic Levy"
 HIN_gangetic_levy_desc: "Draw upon the teeming multitudes of the Doab for an inexhaustible reservoir of soldiers."
 HIN_1857_rising: "The 1857 Legacy Rising"
 HIN_1857_rising_desc: "Kindle the unfinished fire of the Great Rebellion into a revanchist mobilization."
 HIN_war_of_completion: "The War of Completion"
 HIN_war_of_completion_desc: "Turn the fervour of 1857 outward and finish the war the rebels of the Mutiny began."
 HIN_aligarh_path: "The Aligarh Path"
 HIN_aligarh_path_desc: "Follow Sir Syed's modernists into the sciences and the modern administration."
 HIN_banaras_path: "The Banaras Path"
 HIN_banaras_path_desc: "Follow Malaviya's revivalists into a fired-up Hindu renaissance."
 HIN_ganga_federation_council: "The Ganga Federation Council"
 HIN_ganga_federation_council_desc: "Convene the council of the Gangetic plain and set the federation's course among the Indian kingdoms."
