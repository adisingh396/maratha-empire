 BEN_huq_krishak: "Sher-e-Bangla"
 BEN_huq_krishak_desc: "Fazlul Huq speaks for the tenant and the sharecropper; his Krishak Praja movement binds the countryside to the state."
 BEN_sarat_counsel: "The United Bengal Barrister"
 BEN_sarat_counsel_desc: "Sarat Bose argues that a Bengal undivided by faith is a Bengal that no rival can break."
 BEN_nazim_league: "The Dhaka Nawabzada"
 BEN_nazim_league_desc: "Khwaja Nazimuddin carries the weight of the Dhaka aristocracy and the Muslim League behind the throne."
 BEN_jc_bose_theory: "Father of Wireless"
 BEN_jc_bose_theory_desc: "Jagadish Chandra Bose demonstrated radio waves and the response of living tissue before the world took notice; his laboratory is a national treasure."
 BEN_pc_ray_chem: "The Chemist-Industrialist"
 BEN_pc_ray_chem_desc: "Prafulla Chandra Ray built Bengal Chemical & Pharmaceutical Works from nothing; swadeshi industry is his creed."
 BEN_saha_theory: "The Astrophysicist"
 BEN_saha_theory_desc: "Meghnad Saha's ionization equation reshaped stellar physics; he now argues for great rivers to be tamed and planned."
 BEN_sn_bose_theory: "The Quantum Pioneer"
 BEN_sn_bose_theory_desc: "Satyendra Nath Bose's statistics carry his name across the physics of the age; his mind is a strategic asset."
 BEN_tagore_unity: "The Poet of the Nation"
 BEN_tagore_unity_desc: "Rabindranath Tagore's Visva-Bharati and his verse give Bengal a soul the guns of rivals cannot touch."
 BEN_nazrul_propaganda: "The Rebel Poet"
 BEN_nazrul_propaganda_desc: "Kazi Nazrul Islam's fire rouses the young; his songs march faster than any decree."
 BEN_mookerjee_industry: "The Engineer of Burnpur"
 BEN_mookerjee_industry_desc: "Rajendra Nath Mookerjee raised IISCO's furnaces and Martin & Co.'s works; steel and rail are his signature."
 BEN_rash_behari_intel: "The Exile of Tokyo"
 BEN_rash_behari_intel_desc: "Rash Behari Bose, hunted since the Delhi conspiracy, has spun a web of contacts from Bengal to the Pacific."
 BEN_bina_intel: "The Governor's Shot"
 BEN_bina_intel_desc: "Bina Das fired on the Governor at Convocation; her name moves the underground still."

 BEN_flav.1_t: "Netaji Comes Home"
 BEN_flav.1_d: "Subhas Chandra Bose stands in the Calcutta Maidan before a sea of khadi and red. He has broken with the cautious elders and speaks of a Bengal that will not wait, will not beg, and will not be divided. The crowd roars for the man they already call Netaji. The question is whether Bengal will hand him the state, or hold to the older, slower road."
 BEN_flav.1_a: "Give him the vanguard"
 BEN_flav.1_b: "Hold to the Congress road"
 BEN_flav.2_t: "The Forward Bloc"
 BEN_flav.2_d: "Bose will not be a minister among ministers. He forges the Forward Bloc into a disciplined party-militia, drilling volunteers in the mill towns and the delta villages. Old revolutionaries send word that their men are ready to serve under a leader at last. Some fear a state within the state; others see the only army Bengal will ever raise."
 BEN_flav.2_a: "Forge the militia"
 BEN_flav.2_b: "Bind them to the constitution"
 BEN_flav.3_t: "The Great Gambit"
 BEN_flav.3_d: "Bose has never believed Bengal can stand alone against the great powers. Envoys arrive from Berlin and Tokyo with offers of arms and machine tools; the Maratha court sends a quiet warning that Bengal should not sell its independence for rifles. Netaji weighs the enemy of his enemy against the safety of neutrality."
 BEN_flav.3_a: "Take the foreign arms"
 BEN_flav.3_b: "Build our own arsenal"
 BEN_flav.4_t: "The Non-Martial Race"
 BEN_flav.4_d: "For generations the Bengali was told he could not fight, that the officer's sword was not for delta hands. The men of Anushilan and Jugantar, who raided armouries and faced the gallows, laugh at that verdict. Now they offer to become the officer corps of a free Bengal. To take them is to arm a legend; to refuse is to insult the martyrs."
 BEN_flav.4_a: "Make the revolutionaries our officers"
 BEN_flav.4_b: "A regular army answers to the state alone"
 BEN_flav.5_t: "The Chittagong Doctrine"
 BEN_flav.5_d: "Surya Sen's men seized an armoury and held a city for days with nothing but nerve and stolen rifles. Kalpana Datta and the survivors now teach what they learned: infiltration, ambush, the raid that vanishes before the reprisal. Bengal can build a doctrine no drill-manual army will expect."
 BEN_flav.5_a: "Codify the raider's craft"
 BEN_flav.5_b: "Raise a mass of trained irregulars"
 BEN_flav.6_t: "United or Sundered"
 BEN_flav.6_d: "The oldest wound in Bengal is the line between the faiths. Sarat Bose pleads for a single Bengal where Hindu and Muslim share the ministry; Nazimuddin's men and the communal firebrands want the province cut clean. A word from the government now will either bind the delta together or split it down the middle."
 BEN_flav.6_a: "Proclaim a United Bengal"
 BEN_flav.6_b: "Let the communities part"
 BEN_flav.7_t: "The Reckoning in the Districts"
 BEN_flav.7_d: "Whatever Calcutta decreed, the districts must live with it. In some towns the peace committees hold; in others the knives are already out. The government can pour resources into reconciliation, or it can arm the loyal and let the disloyal fear them."
 BEN_flav.7_a: "Fund the peace committees"
 BEN_flav.7_b: "Arm the loyal districts"
 BEN_flav.8_t: "The Krishak Rising"
 BEN_flav.8_d: "Fazlul Huq promised the peasant relief from the moneylender and the zamindar. The Krishak Praja movement has outrun its founder; village committees seize granaries and burn debt-ledgers. The government can ride the wave and abolish the zamindari, or it can slow the tide and buy the landlords' loyalty with power."
 BEN_flav.8_a: "Abolish the zamindari"
 BEN_flav.8_b: "Compromise with the landlords"
 BEN_flav.9_t: "The Debt-Burning Fires"
 BEN_flav.9_d: "The land reform has remade the countryside, but the old order will not go quietly. Displaced zamindars fund troublemakers; radical committees demand more. The government must decide whether the revolution keeps its momentum or settles into a governed peace."
 BEN_flav.9_a: "Consolidate the new order"
 BEN_flav.9_b: "Let the committees push further"
 BEN_flav.10_t: "The Scientist-State"
 BEN_flav.10_d: "J.C. Bose's institute, Ray's chemical works, Saha's astrophysics, and S.N. Bose's statistics have made Calcutta a rival to any capital in learning. The government can pour the treasury into pure research and let genius run, or it can bend the laboratories to the immediate needs of industry."
 BEN_flav.10_a: "Fund the pure sciences"
 BEN_flav.10_b: "Bend science to the factory"
 BEN_flav.11_t: "The Jute Monopoly"
 BEN_flav.11_d: "The whole world's gunny sacks and sandbags are woven on Hooghly looms; Bengal holds a near-monopoly on raw jute and its mills. The Chamber of Commerce urges the state to squeeze the price and reap a fortune, while the planners warn that a hungry world may look for substitutes if Bengal is too greedy."
 BEN_flav.11_a: "Enforce the monopoly price"
 BEN_flav.11_b: "Modernize the mills instead"

 BEN_netaji_call: "The Call of Netaji"
 BEN_netaji_call_desc: "Subhas Chandra Bose returns to Bengal and demands a state equal to his ambition."
 BEN_azad_hind: "Provisional Government"
 BEN_azad_hind_desc: "Bose proclaims a provisional government and the framework of a national army."
 BEN_ina_army: "The Volunteer Army"
 BEN_ina_army_desc: "Raise a disciplined volunteer army from the Forward Bloc and the old revolutionary networks."
 BEN_neutral_arsenal: "The Neutral Arsenal"
 BEN_neutral_arsenal_desc: "Reject foreign entanglement and build Bengal's strength on her own factories."
 BEN_axis_gambit: "The Enemy of My Enemy"
 BEN_axis_gambit_desc: "Weigh alliances with the distant great powers against the safety of standing alone."
 BEN_bose_institute: "The Bose Institute"
 BEN_bose_institute_desc: "Fund J.C. Bose's institute and make it the seed of a scientific state."
 BEN_saha_institute: "Saha's Physics"
 BEN_saha_institute_desc: "Meghnad Saha's astrophysics and river-planning draw the finest minds to Calcutta."
 BEN_science_congress: "The Science Congress"
 BEN_science_congress_desc: "Convene the great minds of Bengal and forge a national research programme."
 BEN_saha_riverplan: "The River-Valley Plan"
 BEN_saha_riverplan_desc: "Saha's dream of taming the great rivers becomes an engine of power and research."
 BEN_raniganj_field: "The Raniganj Field"
 BEN_raniganj_field_desc: "The Raniganj coalfield is the furnace at the heart of Bengal's industry."
 BEN_jharia_coal: "The Jharia Seams"
 BEN_jharia_coal_desc: "Deepen the Jharia coalfields to feed the mills and the foundries."
 BEN_jute_monopoly_focus: "The Golden Fibre"
 BEN_jute_monopoly_focus_desc: "Bengal's jute clothes the world; turn that monopoly into strategic wealth."
 BEN_iisco_expansion: "IISCO Rising"
 BEN_iisco_expansion_desc: "Expand the Burnpur steelworks into the arsenal of the delta."
 BEN_bengal_question: "The Bengal Question"
 BEN_bengal_question_desc: "The faiths, the classes, and the districts all pull at Bengal; the state must answer."
 BEN_united_pact: "The United Bengal Pact"
 BEN_united_pact_desc: "Bind Hindu and Muslim, Calcutta and the districts, into one undivided Bengal."
 BEN_partition_line: "The Partition Line"
 BEN_partition_line_desc: "Cut the province along the line of faith and rally the majority behind the state."
 BEN_krishak_republic: "The Krishak Republic"
 BEN_krishak_republic_desc: "The peasant movement becomes the foundation of the state itself."

 BEN_netaji_vision: "Netaji's Vision"
 BEN_netaji_vision_desc: "A disciplined, mobilized Bengal united behind one leader's uncompromising will."
 BEN_forward_bloc_state: "The Forward Bloc"
 BEN_forward_bloc_state_desc: "A party-militia gives the army spirit and reach, but strains the civil order."
 BEN_revolutionary_cadres: "Revolutionary Cadres"
 BEN_revolutionary_cadres_desc: "The old underground, barred from the sword for generations, becomes the officer corps."
 BEN_communal_balance: "Communal Balance"
 BEN_communal_balance_desc: "Hindu and Muslim share the ministry; a united Bengal is a stable Bengal."
 BEN_krishak_reform: "The Krishak Reform"
 BEN_krishak_reform_desc: "Zamindari abolished, debts forgiven, the peasant tied to the state's cause."
 BEN_bengal_renaissance: "The Bengal Renaissance"
 BEN_bengal_renaissance_desc: "The prestige of Tagore and the laboratories of Calcutta accelerate every science."
 BEN_jute_monopoly: "The Jute Monopoly"
 BEN_jute_monopoly_desc: "Bengal's near-monopoly on raw jute and gunny cloth funds the industrial machine."
 BEN_science_state_1: "Scientist-State (I)"
 BEN_science_state_1_desc: "The laboratories of Bengal begin to serve the nation."
 BEN_science_state_2: "Scientist-State (II)"
 BEN_science_state_2_desc: "A coordinated research programme quickens Bengal's progress."
 BEN_science_state_3: "Scientist-State (III)"
 BEN_science_state_3_desc: "Bengal's scientific establishment rivals any capital in the world."
