l_english:
 PJB_ghaffar: "Abdul Ghaffar Khan"
 PJB_nalwa_chief: "Hari Singh Nalwa"
 PJB_phula_theorist: "Akali Phula Singh"
 PJB_jindan_regent: "Maharani Jind Kaur"
 PJB_tara_counsel: "Master Tara Singh"
 PJB_chhotu_agrarian: "Sir Chhotu Ram"
 PJB_baldev_command: "Sardar Baldev Singh"
 PJB_hardayal_theorist: "Lala Har Dayal"
 PJB_bhakna_command: "Sohan Singh Bhakna"
 PJB_bhagat_theorist: "Bhagat Singh"
 PJB_khalsa_army_tradition: "Khalsa Army Tradition"
 PJB_khalsa_army_tradition_desc: "The reformed Fauj-i-Khas, drilled on European lines by Ventura and Allard, remains the bedrock of Punjabi arms. Sikh soldiers fight with the discipline of the Dal Khalsa and the fervour of the Panth."
 PJB_martial_races: "Martial Races of Punjab"
 PJB_martial_races_desc: "Sikhs, Punjabi Muslims, Jats and Dogras form the subcontinent's premier reservoir of military manpower. The recruiting sardars of the canal districts can raise regiments faster than any rival."
 PJB_panthic_unity: "Panthic Unity"
 PJB_panthic_unity_desc: "The Shiromani Gurdwara Parbandhak Committee binds the gurdwara network into a single mobilising body. The authority of the Akal Takht lends the state a legitimacy no rival durbar can match."
 PJB_unionist_coalition: "Unionist Coalition"
 PJB_unionist_coalition_desc: "Fazl-i-Husain's cross-communal Unionist Party holds the Muslim, Sikh and Hindu agrarian blocs together. So long as the zamindars and peasant proprietors share a common cause, communal partition can be held at bay."
 PJB_canal_colonies: "Canal Colonies"
 PJB_canal_colonies_desc: "The Chenab and Sandal Bar colonies turned desert into the breadbasket of the subcontinent. Lyallpur's grid of canals and market towns feeds the Khalsa and fills the Lahore treasury."
 PJB_ghadar_legacy: "Ghadar Legacy"
 PJB_ghadar_legacy_desc: "The revolutionary networks of the Ghadar Party, from the Punjab villages to the Pacific diaspora, keep alive a tradition of armed insurrection. Their cells melt into the countryside and sap any occupier's strength."
 PJB_second_khalsa_raj: "The Second Khalsa Raj"
 PJB_second_khalsa_raj_desc: "With no annexation of 1849, the Sarkar-i-Khalsa endures. Let the Lahore Durbar proclaim the restoration of the Sikh Empire under the line of Ranjit Singh."
 PJB_lahore_durbar_restored: "The Lahore Durbar"
 PJB_lahore_durbar_restored_desc: "Reconvene the great durbar of the Maharaja and rebuild the machinery of the Khalsa state around the throne."
 PJB_panthic_sovereignty: "Panthic Sovereignty"
 PJB_panthic_sovereignty_desc: "Master Tara Singh and the Akali Dal press for a sovereign Sikh polity, drawing authority from the Panth rather than the throne."
 PJB_unionist_accord: "The Unionist Accord"
 PJB_unionist_accord_desc: "Follow the path of Sikandar and Khizar Tiwana: a cross-communal government of landholders that binds Punjab's peoples against the winds of partition."
 PJB_ghadar_veterans: "The Ghadar Veterans"
 PJB_ghadar_veterans_desc: "Bring the revolutionary networks of Har Dayal and Sohan Singh Bhakna into the service of the state, or turn them loose upon its enemies."
 PJB_canal_colony_charter: "Canal Colony Charter"
 PJB_canal_colony_charter_desc: "Charter new grants across the bars, settling ex-soldiers on freshly irrigated land and cementing the loyalty of the agrarian classes."
 PJB_martial_recruitment: "The Martial Races"
 PJB_martial_recruitment_desc: "Open the recruiting rolls of the martial districts and raise the Khalsa to full war strength."
 PJB_march_of_the_khalsa: "March of the Khalsa"
 PJB_march_of_the_khalsa_desc: "Revive the conquests of Hari Singh Nalwa and Zorawar Singh. The Khalsa marches north and west to reclaim its lost frontiers."
 PJB_reclaim_khyber: "Reclaim the Khyber"
 PJB_reclaim_khyber_desc: "Retake the passes that Nalwa held and fell defending at Jamrud. The Khyber must once more answer to Lahore."
 PJB_reclaim_kashmir: "Reclaim Kashmir"
 PJB_reclaim_kashmir_desc: "Zorawar Singh's Himalayan campaigns carried the Khalsa to Ladakh and Baltistan. Press the claim to the mountain kingdom."
 PJB_flav.1_t: "The Restoration of the Sarkar-i-Khalsa"
 PJB_flav.1_d: "The elders of the Panth and the sardars of the misls gather at the Lahore Fort. A century after the Anglo-Sikh wars that never came, the question is settled at last: shall the Sikh Empire be restored in full, under the crown of Ranjit Singh's heirs?"
 PJB_flav.1_a: "Proclaim the Second Khalsa Raj"
 PJB_flav.1_b: "Rebuild the army first"
 PJB_flav.2_t: "A Regent for the Throne"
 PJB_flav.2_d: "The heir is young, and the sardars quarrel over who shall guide his hand. Maharani Jind Kaur's faction demands a regency council; the generals would rather the crown lean on their bayonets."
 PJB_flav.2_a: "Establish a regency council"
 PJB_flav.2_b: "Let the army guide the throne"
 PJB_flav.3_t: "The Fauj-i-Khas Reborn"
 PJB_flav.3_d: "The old drill manuals of Ventura and Allard are unearthed. The Lahore arsenal hums once more. Shall we train the regiments in the European style, or expand the foundries to arm them first?"
 PJB_flav.3_a: "Drill in the European style"
 PJB_flav.3_b: "Expand the arsenal"
 PJB_flav.4_t: "The Voice of the Panth"
 PJB_flav.4_d: "From the Akal Takht, Master Tara Singh proclaims that sovereignty flows from the Panth, not the durbar. The SGPC's gurdwara network stands ready to mobilise. Do we embrace a Panthic state, or keep the sacred and the secular apart?"
 PJB_flav.4_a: "Build the Panthic state"
 PJB_flav.4_b: "Keep the durbar above the Panth"
 PJB_flav.5_t: "The Gurdwara Levy"
 PJB_flav.5_d: "The SGPC opens its coffers and its rolls. The gurdwaras can raise volunteers by the thousand, or fund the schools and langars that hold the community together."
 PJB_flav.5_a: "Raise the volunteers"
 PJB_flav.5_b: "Fund the community"
 PJB_flav.6_t: "The Unionist Bargain"
 PJB_flav.6_d: "Sir Sikandar and Khizar Tiwana convene the landholders of every community. A government of Muslim, Sikh and Hindu zamindars could hold Punjab together, but only if each faction sheathes its communal knives."
 PJB_flav.6_a: "Forge the Unionist coalition"
 PJB_flav.6_b: "Rule without the compromise"
 PJB_flav.7_t: "The Land Alienation Question"
 PJB_flav.7_d: "Sir Chhotu Ram presses for laws to protect the peasant proprietor from the moneylender. The measure would bind the agrarian classes to the state, but the urban financiers grumble."
 PJB_flav.7_a: "Protect the cultivators"
 PJB_flav.7_b: "Appease the financiers"
 PJB_flav.8_t: "The Ghadar Returns"
 PJB_flav.8_d: "The veterans of the 1914 mutiny plan, and the diaspora cells from the Pacific coast, offer their networks to the cause. Their methods are revolutionary and their loyalty is to the ghadar, not the throne."
 PJB_flav.8_a: "Unleash the Ghadar networks"
 PJB_flav.8_b: "Keep the revolutionaries in check"
 PJB_flav.9_t: "The Diaspora Answers"
 PJB_flav.9_d: "Remittances and volunteers flow from the Punjabi settlements abroad. The money can arm new levies, or the cells can be woven into the machinery of the state."
 PJB_flav.9_a: "Arm the levies"
 PJB_flav.9_b: "Institutionalise the networks"
 PJB_flav.10_t: "The Frontier Beckons"
 PJB_flav.10_d: "The tribes of the frontier test the passes once more. The memory of Nalwa's forts at Jamrud and Attock stirs the Khalsa. Shall we march to reclaim the northwest, or consolidate the border we hold?"
 PJB_flav.10_a: "Order the march north"
 PJB_flav.10_b: "Fortify the frontier"
 PJB_flav.11_t: "The Passes of Zorawar"
 PJB_flav.11_d: "Beyond the mountains lie Ladakh, Baltistan and the vale of Kashmir that Zorawar Singh once carried the Khalsa flag across. The high command urges a campaign; the recruiters ask for more hillmen first."
 PJB_flav.11_a: "Press the mountain claim"
 PJB_flav.11_b: "Raise more frontier levies"
 PJB_flav.12_t: "The Partition Crisis"
 PJB_flav.12_d: "Punjab's communal fault lines groan. The League demands a Muslim province, the Panth a Sikh homeland, the Hindu sabhas their own share. The province stands upon the edge of a three-way fracture, and Lahore must choose its course."
 PJB_flav.12_a: "Hold Punjab together"
 PJB_flav.12_b: "Rally behind the Khalsa"
 PJB_flav.12_c: "Order population transfers"
 PJB_flav.13_t: "The Blood Line"
 PJB_flav.13_d: "Boundary commissions draw lines that no community will accept. The columns are already moving on the roads. We may yet negotiate a settlement, or seize the disputed districts by force."
 PJB_flav.13_a: "Negotiate the boundary"
 PJB_flav.13_b: "Seize the disputed districts"
