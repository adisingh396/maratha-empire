l_english:
 # ===== Ideas / national spirits =====
 SIN_sindhi_nationalism: "Sindhi Nationalism"
 SIN_sindhi_nationalism_desc: "The land of Shah Abdul Latif and the Indus has a nationhood older than any empire. Sindhi tongue, Sindhi soil, Sindhi state."
 SIN_composite_republic: "Composite Sindh"
 SIN_composite_republic_desc: "Allah Bakhsh Soomro's vision: a Sindh where Hindu Bhaiband, Muslim hari and Sikh trader share one homeland, standing against the Two-Nation creed."
 SIN_hur_jamaat: "The Hur Jamaat"
 SIN_hur_jamaat_desc: "The murid warriors of the Pir Pagaro fight and die on his word alone. Fanatical, elusive, and ungovernable by any Wadero or premier."
 SIN_theocratic_state: "Shrine of the Faithful"
 SIN_theocratic_state_desc: "The Pir sits enthroned at Pir-jo-Goth, temporal and spiritual master of Sindh. The green banner of the Hurs flies over Karachi."
 SIN_karachi_free_port: "Free Port of the Indus"
 SIN_karachi_free_port_desc: "Karachi's harbour is thrown open to the trade of the world. Grain, cotton and hides flow out; capital and ships flow in."
 SIN_banking_diaspora: "Sindhi Banking Diaspora"
 SIN_banking_diaspora_desc: "The Shikarpuri and Hyderabadi Bhaiband financiers command credit networks from Bukhara to Panama. Their hundis are as good as gold."
 SIN_talpur_legacy: "The Talpur Legacy"
 SIN_talpur_legacy_desc: "The Mirs who ruled Sindh until Miani have never truly gone. From Khairpur their line endures, and old loyalties stir."
 SIN_wadero_landlords: "The Waderos"
 SIN_wadero_landlords_desc: "The great feudal landlords hold the countryside in their fist. Their loyalty buys manpower and revenue, but the haris groan beneath them."
 SIN_sukkur_irrigation_1: "Sukkur Barrage"
 SIN_sukkur_irrigation_1_desc: "Arnold Musto's barrage at Sukkur, the largest irrigation work on earth, brings the desert into cultivation."
 SIN_sukkur_irrigation_2: "The Canal Colonies"
 SIN_sukkur_irrigation_2_desc: "Seven great canals march across the Sindhi plain. New settlers break the fallow and the harvests swell."
 SIN_sukkur_irrigation_3: "Garden of the Indus"
 SIN_sukkur_irrigation_3_desc: "The barrage system is perfected. Sindh feeds itself and the ports besides, a granary reborn from sand."

 # ===== Focuses =====
 SIN_sindh_reborn: "Sindh Reborn"
 SIN_sindh_reborn_desc: "On the first of April a province becomes a nation. Let us build the state that the separation from Bombay has made possible."
 SIN_first_premier: "The First Premier"
 SIN_first_premier_desc: "A ministry, an assembly, a treasury of our own. Sir Ghulam Hussain takes the seals of office over a Sindh that governs itself."
 SIN_political_crossroads: "The Sindhi Question"
 SIN_political_crossroads_desc: "What manner of nation shall Sindh become? The Pir's murids, the composite nationalists and the Leaguers all press their claim."
 SIN_hur_theocracy: "The Pir's Sindh"
 SIN_hur_theocracy_desc: "Let the spiritual master of the Hurs be the master of Sindh. Faith and rifle bind the murid to the throne of Pir-jo-Goth."
 SIN_pir_ascendant: "The Green Banner Ascendant"
 SIN_pir_ascendant_desc: "The Hur Jamaat is raised into a standing host. No armoured train nor martial law shall break the murids now."
 SIN_secular_sindh: "A Composite Homeland"
 SIN_secular_sindh_desc: "Soomro's road: a Sindh of all its peoples. We reject the poison of communal partition before it is ever poured."
 SIN_azad_conference: "The Azad Muslim Conference"
 SIN_azad_conference_desc: "We convene the anti-League conference in Karachi and proclaim that Sindhi Muslims will not be marched into another nation's cause."
 SIN_free_port_karachi: "Free Port of Karachi"
 SIN_free_port_karachi_desc: "Jamshed Mehta's dream: throw open the harbour, cut the customs walls, and let Karachi become the great emporium of the western sea."
 SIN_merchant_republic: "The Merchant Republic"
 SIN_merchant_republic_desc: "The banking houses and trading guilds shall have their voice. A republic of commerce rises on the Arabian shore."
 SIN_arabian_sea_trade: "Emporium of the West"
 SIN_arabian_sea_trade_desc: "Our dhows and steamers ply from Aden to Bombay. Karachi's wharves never sleep."
 SIN_barrage_authority: "The Barrage Authority"
 SIN_barrage_authority_desc: "Constitute the authority that will run Musto's great work and carry irrigation across the whole of Sindh."
 SIN_canal_colonies: "The Canal Colonies"
 SIN_canal_colonies_desc: "Settle the newly-watered lands. Where there was thorn scrub there shall be wheat, cotton and rice."
 SIN_barrage_perfected: "Garden of the Indus"
 SIN_barrage_perfected_desc: "The barrage and its canals are brought to their full design. Sindh becomes the granary of the subcontinent's west."
 SIN_talpur_restoration: "The Talpur Restoration"
 SIN_talpur_restoration_desc: "The Mirs lost their throne at Miani in 1843. From the surviving seed of Khairpur, let the old dynasty rise again."
 SIN_reunite_mirs: "The Mirs Reunited"
 SIN_reunite_mirs_desc: "Gather the scattered Talpur houses under one crown. The kingdom of the Mirs is whole once more."

 # ===== Advisor idea tokens =====
 SIN_soomro_secular: "Composite Nationalist"
 SIN_syed_nationalist: "Father of Sindhi Nationalism"
 SIN_bhutto_wadero: "Landed Grandee"
 SIN_majeed_autonomy: "Autonomy Campaigner"
 SIN_haroon_trade: "Merchant-Magnate"
 SIN_jamshed_civic: "Maker of Modern Karachi"
 SIN_musto_engineer: "Chief Barrage Engineer"

 # ===== Events: Sindh Reborn chain =====
 SIN_flav.1_t: "A Province No Longer"
 SIN_flav.1_d: "For years the Sindhis pressed their case: to be severed from the Bombay Presidency and stand on their own. Now it is done. From the Sukkur Barrage to the Karachi wharves, the land of the lower Indus is a nation in its own right. But a name is not a state — that must be built from nothing."
 SIN_flav.1_a: "A province no longer — a nation!"
 SIN_flav.1_b: "Caution — the Waderos must be kept close."
 SIN_flav.2_t: "The Machinery of State"
 SIN_flav.2_d: "A new nation needs ministries, courts, a revenue service and an army. The treasury is thin and the great landlords resist every tax. Sir Ghulam Hussain's ministry must find the coin to make Sindh govern itself — or lean on the merchant houses of Karachi for credit."
 SIN_flav.2_a: "Build the machinery of state ourselves."
 SIN_flav.2_b: "Lean on the Karachi merchants for revenue."
 SIN_flav.3_t: "The Soul of Sindh"
 SIN_flav.3_d: "With the state taking shape, the deeper question can no longer be deferred. Is Sindh a Sindhi Muslim nation, an heir to the Two-Nation idea? Or is it a composite homeland of all who live by the river, Hindu banker and Muslim hari alike? The answer will define everything that follows."
 SIN_flav.3_a: "A Sindhi nation for the Sindhi people."
 SIN_flav.3_b: "A composite home for all who dwell by the Indus."

 # ===== Events: Hur Rebellion chain =====
 SIN_flav.4_t: "The Hurs Rise"
 SIN_flav.4_d: "In the riverain and the Thar the murids of the Pir Pagaro have taken up arms. They derail trains, raid the Waderos and vanish into the tamarisk. The government of Bombay once answered such a rising with martial law and armoured columns. Sindh must now decide for itself."
 SIN_flav.4_a: "Crush the Hur bands — proclaim martial law."
 SIN_flav.4_b: "Treat with the Pir — a shrine-state accommodation."
 SIN_flav.5_t: "Martial Law on the Indus"
 SIN_flav.5_d: "Armoured trains crawl the Rohri line and a special ordinance suspends the ordinary law across the Hur country. The murids fight with a fanatic's disregard for death, for the Pir has promised them paradise. Breaking them will take either steel or silver."
 SIN_flav.5_a: "Armoured trains and the special ordinance."
 SIN_flav.5_b: "Buy off the Waderos to isolate the Hurs."
 SIN_flav.6_t: "The Reckoning of the Pir"
 SIN_flav.6_d: "The rebellion reaches its climax. Either the spiritual master of the Hurs is taken and his Jamaat scattered — or he turns the rising into a throne, and the green banner is raised over a Sindh ruled from the shrine at Pir-jo-Goth."
 SIN_flav.6_a: "The Pir hangs — the Jamaat is broken."
 SIN_flav.6_b: "The Pir crowns himself — a theocratic Sindh."

 # ===== Events: Karachi Free Port chain =====
 SIN_flav.7_t: "The Free Port Question"
 SIN_flav.7_d: "Karachi's deep-water harbour is the gateway of the Indus, exporting the grain and cotton of half a subcontinent. The merchant houses beg the government to declare it a free port and cut away the customs walls. The premier fears the loss of revenue such a gift would cost."
 SIN_flav.7_a: "Declare Karachi a free port of the Indus."
 SIN_flav.7_b: "Keep the customs house in state hands."
 SIN_flav.8_t: "The Cosmopolitan Harbour"
 SIN_flav.8_d: "Karachi swells with Parsi shipowners, Sindhi bankers, Goan clerks and Baluch stevedores. Mayor Jamshed Mehta governs a city of many tongues. Shall it become a self-governing merchant republic on the Arabian Sea, or remain firmly under the premier's hand?"
 SIN_flav.8_a: "A merchant republic on the Arabian Sea."
 SIN_flav.8_b: "The mayor answers to the premier, not the guilds."

 # ===== Events: Talpur Restoration chain =====
 SIN_flav.9_t: "The Heirs of Miani"
 SIN_flav.9_d: "The Talpur Mirs ruled all of Sindh until the disaster at Miani in 1843. Their line did not perish — in Khairpur a Talpur throne still stands. The old aristocracy whispers that the dynasty deposed a lifetime ago might yet be restored to its full inheritance."
 SIN_flav.9_a: "Restore the Mirs deposed at Miani."
 SIN_flav.9_b: "Khairpur shall remain but one princely seat."
 SIN_flav.10_t: "One Crown or Many"
 SIN_flav.10_d: "If the Talpurs are to return, in what form? A single Mir enthroned as sovereign over the whole of Sindh, or a federation of the Talpur houses with the Mir of Khairpur as first among equals? The nobility is divided, and each faction has its swords."
 SIN_flav.10_a: "One Talpur crown over all Sindh."
 SIN_flav.10_b: "A federation of Mirs under a first-among-equals."

 # ===== Events: Secular vs Two-Nation fork =====
 SIN_flav.11_t: "The Question of the Two Nations"
 SIN_flav.11_d: "Allah Bakhsh Soomro, the secular premier, has raised the banner of composite nationalism against the League's Two-Nation theory. His enemies call him a traitor to his co-religionists; his friends hail him as the conscience of Sindh. The struggle is bitter and it grows dangerous."
 SIN_flav.11_a: "Stand firmly for the composite line."
 SIN_flav.11_b: "Let the communal tide take its course."
 SIN_flav.12_t: "The Martyr of Composite Sindh"
 SIN_flav.12_d: "Allah Bakhsh Soomro lies dead, cut down by an assassin's hand. The secular cause has its martyr. His followers swear that his Sindh — of Hindu, Muslim and Sikh together — will outlive the men who killed him."
 SIN_flav.12_a: "A secular Sindh of Hindus, Muslims and Sikhs."
 SIN_flav.12_b: "Bury him quietly and move on."
 SIN_flav.13_t: "The Two-Nation Triumph"
 SIN_flav.13_d: "With the composite nationalists leaderless, the League's creed sweeps the field. Sindh is to be the homeland of a Sindhi Muslim nation, and the old dream of a shared river-country recedes. There are those who mourn it, and those who cheer."
 SIN_flav.13_a: "Sindh for the Sindhi Muslim nation."
 SIN_flav.13_b: "Communal peace is worth more than the theory."

 # ===== Standalone: Manzilgah flashpoint =====
 SIN_flav.14_t: "The Manzilgah Dispute"
 SIN_flav.14_d: "A quarrel over the old Manzilgah mosque at Sukkur has set Hindu and Muslim mobs against one another, and the murder of the beloved Sufi singer Bhagat Kanwar Ram has poured oil on the flames. The streets of Sindh could burn. The government must act, and quickly."
 SIN_flav.14_a: "Suppress both mobs with an even hand."
 SIN_flav.14_b: "Side with the majority to keep the streets."
