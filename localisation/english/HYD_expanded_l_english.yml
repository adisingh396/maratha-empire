 HYD_salar_jung3_reform: "Salar Jung III"
 HYD_salar_jung3_reform_desc: "The art-collecting former Diwan lends his prestige to the reforming cabinet, oiling the machinery of state."
 HYD_kishen_pershad_unity: "Maharaja Kishen Pershad"
 HYD_kishen_pershad_unity_desc: "The twice-Diwan Hindu poet embodies the Ganga-Jamuni court, binding the majority to the throne."
 HYD_akbar_hydari_finance: "Sir Akbar Hydari"
 HYD_akbar_hydari_finance_desc: "The finance member turns Golconda wealth into railways, mills and mines."
 HYD_chhatari_caretaker: "Nawab of Chhatari"
 HYD_chhatari_caretaker_desc: "The seasoned caretaker premier steadies the ship of state through crisis."
 HYD_chhatari_hc: "Nawab of Chhatari"
 HYD_chhatari_hc_desc: "A capable hand over the State Forces high command."
 HYD_ramananda_congress: "Swami Ramananda Tirtha"
 HYD_ramananda_congress_desc: "The State Congress leader channels popular demand for responsible government."
 HYD_sundarayya_hc: "Puchalapalli Sundarayya"
 HYD_sundarayya_hc_desc: "The commander of the Telangana armed squads brings guerrilla discipline to the field."
 HYD_narayana_sangham: "Ravi Narayana Reddy"
 HYD_narayana_sangham_desc: "The Andhra Mahasabha organiser rallies the peasant sanghams behind the red flag."
 HYD_narayana_hc: "Ravi Narayana Reddy"
 HYD_narayana_hc_desc: "A veteran of the village committees now marshalling the people's militia."
 HYD_makhdoom_theory: "Makhdoom Mohiuddin"
 HYD_makhdoom_theory_desc: "The Urdu poet-organiser theorises a people's war on the Deccan plateau."

 HYD_own_currency: "The Osmania Sicca Rupee"
 HYD_own_currency_desc: "Hyderabad mints its own coin and holds a treasury the world envies, buying policy freedom that other courts can only dream of."
 HYD_razakar_militia: "The Razakar Militia"
 HYD_razakar_militia_desc: "Kasim Razvi's green-clad volunteers swell the ranks and cow the streets, but their excesses bleed the state's standing."
 HYD_telangana_uprising: "The Telangana Uprising"
 HYD_telangana_uprising_desc: "Armed peasant sanghams hold the villages against deshmukh and Nizam alike, a war fought hut by hut."
 HYD_ganga_jamuni: "The Ganga-Jamuni Composite"
 HYD_ganga_jamuni_desc: "A syncretic court of Hindu premiers and Urdu poets reconciles the Muslim crown to its Hindu majority."
 HYD_salar_jung_reform: "The Salar Jung Reforms"
 HYD_salar_jung_reform_desc: "A professional civil service, Osmania science and modern works remake the dominion in the reforming Diwan's image."
 HYD_deccan_diamonds: "The Deccan Diamonds"
 HYD_deccan_diamonds_desc: "Golconda's fabled mines and Singareni's coal fund the arsenals of a rising power."

 HYD_flav.1_t: "The Firman of Sovereignty"
 HYD_flav.1_d: "The cabinet lays before His Exalted Highness a firman of full sovereignty. Hyderabad is no vassal, they argue: it mints its own coin, runs its own railway, fields its own army. The Maratha hegemon will not welcome an independent Osmanistan on the plateau — but the world's richest prince need bow to no one."
 HYD_flav.1_a: "Proclaim Osmanistan"
 HYD_flav.1_b: "The moment is not ripe"
 HYD_flav.2_t: "The Sea-Outlet Question"
 HYD_flav.2_d: "A sovereign dominion needs a window on the ocean. The staff maps a corridor east to the Bay of Bengal, cutting through Maratha-claimed districts. The alternative is a humbling lease from a neighbour — coin for access, and a share of Golconda's stones as surety."
 HYD_flav.2_a: "Seize the corridor by arms"
 HYD_flav.2_b: "Purchase a leased port"
 HYD_flav.3_t: "Recognition Abroad"
 HYD_flav.3_d: "Envoys arrive at the Chowmahalla Palace: some bearing treaties of friendship, others bearing catalogues of arms. The Nizam may trade his diamonds for standing among nations, or for the guns to defend that standing."
 HYD_flav.3_a: "Court diplomatic recognition"
 HYD_flav.3_b: "Buy modern armaments"
 HYD_flav.4_t: "The Green Volunteers"
 HYD_flav.4_d: "Kasim Razvi's Razakars parade through the old city in their thousands, the Ittehad's crescent banners high. They offer the throne a wall of loyal muscle against Congress and communist alike — at the price of handing the streets to zealots the aristocratic cabinet cannot control."
 HYD_flav.4_a: "Arm the Razakars"
 HYD_flav.4_b: "Disband the militia"
 HYD_flav.5_t: "Excesses in the Villages"
 HYD_flav.5_d: "Reports flood in from the districts: the Razakars have turned from defence to terror, and the countryside is arming against them. Every village burned recruits a hundred fighters for the sanghams. The state must choose whether to ride the whirlwind or rein it in."
 HYD_flav.5_a: "Let the militia have its head"
 HYD_flav.5_b: "Punish the worst offenders"
 HYD_flav.6_t: "The Sanghams Rise"
 HYD_flav.6_d: "In Nalgonda and Warangal the Andhra Mahasabha's village committees have stopped paying the deshmukhs and begun seizing their lands. Makhdoom's verses are sung at the meetings; Sundarayya's squads drill in the forests. A peasant war is kindling on the black-soil plains."
 HYD_flav.6_a: "Raise the red flag"
 HYD_flav.6_b: "Send the State Forces to crush it"
 HYD_flav.7_t: "Land to the Tiller"
 HYD_flav.7_d: "The sanghams have broken the deshmukh order across a thousand villages, cancelling debts and redistributing the fields. The old landlordism is dead in Telangana. What rises in its place — a reconciled people's dominion, or a spear aimed outward — is now to be decided."
 HYD_flav.7_a: "Consolidate the land reform"
 HYD_flav.7_b: "Carry the revolution to the hegemon"
 HYD_flav.8_t: "The Composite Court"
 HYD_flav.8_d: "Kishen Pershad's memory is invoked in council: a Hindu Diwan who wrote Urdu verse and served a Muslim throne. Nearly nine in ten subjects are Hindu. The reforming faction urges a composite settlement to bind them to the crown; the reaction warns that concession only invites more."
 HYD_flav.8_a: "Embrace the composite settlement"
 HYD_flav.8_b: "Hold the line of the crown"
 HYD_flav.9_t: "The Diwan's Blueprint"
 HYD_flav.9_d: "The reform bureau lays out a decade's programme: Singareni coal at full pitch, an Osmania faculty of engineering, a merit civil service to replace the jagirdar's clerks. It is Salar Jung's old dream, costed and drawn — the modernisation of a medieval treasury-state."
 HYD_flav.9_a: "Fund the full programme"
 HYD_flav.9_b: "Build the works first"
 HYD_flav.10_t: "The March of the Deccan"
 HYD_flav.10_d: "El Edroos lays the plateau before the throne: the Nizam's treasury can field an army the Marathas cannot ignore, and the southern uplands are the natural dominion of Hyderabad. To march is to gamble the dynasty; to abstain is to accept the hegemon's shadow forever."
 HYD_flav.10_a: "March against the Maratha"
 HYD_flav.10_b: "Seek accommodation instead"

 HYD_osmanistan_bid: "Proclaim Osmanistan"
 HYD_osmanistan_bid_desc: "Assert Hyderabad's full sovereignty as an independent Deccan power, neither vassal nor petitioner."
 HYD_own_mint: "The Osmania Mint"
 HYD_own_mint_desc: "Formalise the state's own currency and treasury as the bedrock of independence."
 HYD_sea_outlet: "A Window on the Ocean"
 HYD_sea_outlet_desc: "Secure the coastal corridor that a sovereign dominion needs to breathe."
 HYD_political_crossroads: "The Political Crossroads"
 HYD_political_crossroads_desc: "The Hindu majority and the Muslim crown reach their reckoning; the path chosen here defines the dominion."
 HYD_razakar_state: "The Razakar State"
 HYD_razakar_state_desc: "Hand the streets to Kasim Razvi's militia and rule through the Ittehad's zeal."
 HYD_ganga_jamuni_reform: "The Ganga-Jamuni Reform"
 HYD_ganga_jamuni_reform_desc: "Reconcile crown and majority through a syncretic, reforming settlement."
 HYD_andhra_sanghams: "The Andhra Sanghams"
 HYD_andhra_sanghams_desc: "Nurture the peasant committees of the black-soil plains into an organised movement."
 HYD_peoples_war: "The People's War"
 HYD_peoples_war_desc: "Turn the sanghams into an armed rebellion against the deshmukh order."
 HYD_land_to_tiller: "Land to the Tiller"
 HYD_land_to_tiller_desc: "Redistribute the fields and cancel the debts, breaking landlordism forever."
 HYD_salar_jung_restoration: "The Salar Jung Restoration"
 HYD_salar_jung_restoration_desc: "Revive the great reforming Diwan's programme of technocratic modernisation."
 HYD_singareni_coal: "The Singareni Collieries"
 HYD_singareni_coal_desc: "Drive the Deccan coalfields and diamond mines to fuel a modern arsenal."
 HYD_civil_service: "A Merit Civil Service"
 HYD_civil_service_desc: "Replace jagirdar patronage with a professional, examined administration."
 HYD_railway_state_spirit: "The Nizam's State Railway"
 HYD_railway_state_spirit_desc: "The Guaranteed State Railway threads the Deccan, speeding troops and trade across the dominion."
 HYD_mill_reforms_spirit: "The Mill Reforms"
 HYD_mill_reforms_spirit_desc: "Modern mills and factory councils raise output across Hyderabad's industrial towns."
