l_english:
 WIS_krishnakumar_adv:0 "Krishnakumarsinhji of Bhavnagar"
 WIS_krishnakumar_adv_desc:0 "The reforming prince of Bhavnagar, first to open his ports and schools to the people."
 WIS_kasturbhai_adv:0 "Kasturbhai Lalbhai"
 WIS_kasturbhai_adv_desc:0 "Master of the Arvind mills and the Ahmedabad Millowners' Association; where his looms run, the treasury swells."
 WIS_sarabhai_adv:0 "Ambalal Sarabhai"
 WIS_sarabhai_adv_desc:0 "Proprietor of the Calico Mills and the Sarabhai chemical works; he can turn cloth into cordite."
 WIS_agakhan_adv:0 "Aga Khan III"
 WIS_agakhan_adv_desc:0 "Ismaili Imam and financier of world standing; his purse and his contacts open every chancellery."
 WIS_madhavrao_adv:0 "Sir T. Madhav Rao"
 WIS_madhavrao_adv_desc:0 "The legendary Dewan whose administration made Baroda a model state; his methods still guide the ministries."
 WIS_pilaji_adv:0 "Pilaji Gaekwad"
 WIS_pilaji_adv_desc:0 "The Maratha founder of Baroda, whose horse and lance carved a kingdom out of Gujarat."
 WIS_chinubhai_adv:0 "Sir Chinubhai Madhavlal"
 WIS_chinubhai_adv_desc:0 "The first Ahmedabad mill-owner to be made a baronet; father of the city's cotton fortunes."
 WIS_ranjitsinhji_adv:0 "Ranjitsinhji Vibhaji II"
 WIS_ranjitsinhji_adv_desc:0 "The cricketer-prince turned League of Nations delegate, whose fame carries Kathiawar's name to the world."

 WIS_gaekwad_education:0 "Gaekwad Education Reform"
 WIS_gaekwad_education_desc:0 "Sayajirao's decree of compulsory free schooling and public libraries has raised a literate, inventive people."
 WIS_ahmedabad_mills:0 "Ahmedabad Mills"
 WIS_ahmedabad_mills_desc:0 "The calico cluster of the Manchester of the East drives our industry at a pace no rival can match."
 WIS_kathiawar_marine:0 "Kathiawar Merchant Marine"
 WIS_kathiawar_marine_desc:0 "The federated ports of Kathiawar and Kutch field a merchant fleet that rules the Arabian Sea trade lanes."
 WIS_diamond_cutters:0 "Diamond Cutters of Surat"
 WIS_diamond_cutters_desc:0 "The Surat cutting guilds and the Gulf dhow trade pour hard currency into the exchequer."
 WIS_bank_of_baroda:0 "Bank of Baroda"
 WIS_bank_of_baroda_desc:0 "A modern state bank underwrites our industry and steadies the price of every rupee."
 WIS_maratha_heritage:0 "Maratha Heritage"
 WIS_maratha_heritage_desc:0 "The Gaekwads remember they are sons of the Maratha soil; the old martial spirit stiffens our regiments."

 WIS_flav.1_t:0 "The Gaekwad Enlightenment"
 WIS_flav.1_d:0 "From the Laxmi Vilas Palace the Maharaja summons his ministers. Sayajirao has read the reformers of Europe and the sages of India alike, and he means to remake Baroda into the most enlightened court in the subcontinent. But gold is finite, and every rupee spent on a schoolhouse is a rupee denied to a mill or a regiment."
 WIS_flav.1_a:0 "Compulsory free education for every child"
 WIS_flav.1_b:0 "The mills must come before the schoolhouse"
 WIS_flav.2_t:0 "A Bank for the People"
 WIS_flav.2_d:0 "The merchant houses of Baroda and Ahmedabad petition the throne: give us a state bank, they say, and we will finance the age. A chartered bank would bind the merchant princes to the crown and steady our currency — yet it would also loosen the palace's grip on the treasury."
 WIS_flav.2_a:0 "Charter the Bank of Baroda"
 WIS_flav.2_b:0 "Keep the treasury in the palace vaults"
 WIS_flav.3_t:0 "Libraries and Colleges"
 WIS_flav.3_d:0 "The foundations are laid for Baroda College and a network of free public libraries — the first of their kind under an Indian crown. The scholars promise a generation of engineers and administrators. The generals grumble that letters win no wars."
 WIS_flav.3_a:0 "Endow the college and the free libraries"
 WIS_flav.3_b:0 "A durbar needs soldiers, not scholars"
 WIS_flav.4_t:0 "Manchester of the East"
 WIS_flav.4_d:0 "Ahmedabad's chimneys blacken the sky from the Sabarmati to the Kankaria. Kasturbhai Lalbhai and Ambalal Sarabhai lead a Millowners' Association that already clothes half of India. They ask only that the state stand behind them — or, if it will not, at least not tax them into ruin."
 WIS_flav.4_a:0 "Back the Millowners' Association"
 WIS_flav.4_b:0 "Tax the mills to fill the state coffers"
 WIS_flav.5_t:0 "Looms of War"
 WIS_flav.5_d:0 "War-talk drifts down from the Deccan and across the Rann. The mills that weave calico could as easily weave webbing, tentage, and uniforms — or turn out shell casings from the Sarabhai chemical works. But every loom turned to war is a loom lost to the export trade that made us rich."
 WIS_flav.5_a:0 "Convert the calico looms to war production"
 WIS_flav.5_b:0 "Keep exporting cloth to the world"
 WIS_flav.6_t:0 "The Kathiawar Maritime League"
 WIS_flav.6_d:0 "Jamnagar, Bhavnagar, Porbandar, Veraval, Kandla, Mandvi — a necklace of harbours strung along the peninsula, each ruled by its own proud raja. Digvijaysinhji of Nawanagar proposes they federate their fleets and customs into a single Maritime League. The lesser princes fear losing their harbours to Baroda's shadow."
 WIS_flav.6_a:0 "Federate the Kathiawar ports"
 WIS_flav.6_b:0 "Let each raja keep his own harbour"
 WIS_flav.7_t:0 "The Harbour at Bedi"
 WIS_flav.7_d:0 "The Jam Sahib has already dredged and built the great port of Bedi at Jamnagar. The Kutchi dhow captains, who have traded to Zanzibar and Muscat for centuries, offer their fleets to the League. We may pour concrete into a modern harbour, or simply pay the dhow-men to sail under our flag."
 WIS_flav.7_a:0 "Build the great modern harbour at Bedi"
 WIS_flav.7_b:0 "Underwrite the Kutchi dhow fleets"
 WIS_flav.8_t:0 "The Diamond Road"
 WIS_flav.8_d:0 "In Surat the diamond guilds cut stones brought by dhow from the Gulf and beyond, and send them polished to the courts of the world. Here is a river of hard currency — if the crown can master it. The guilds prize their independence; the treasury prizes their gold."
 WIS_flav.8_a:0 "License and protect the diamond guilds"
 WIS_flav.8_b:0 "Nationalise the Gulf dhow trade"
 WIS_flav.9_t:0 "Baroda and the Maratha Question"
 WIS_flav.9_d:0 "The house of Gaekwad did not spring from Gujarati soil. Pilaji Gaekwad rode down from the Deccan two centuries ago as a Maratha captain, and carved Baroda from the plain with his lance. Now the Maratha court in the east calls its scattered kin home. Are we Marathas ruling Gujaratis — or Gujaratis who have forgotten a distant cousin?"
 WIS_flav.9_a:0 "We are Gaekwads, sons of the Maratha soil"
 WIS_flav.9_b:0 "Gujarat answers to no distant Peshwa"
 WIS_flav.10_t:0 "The Weight of Old Banners"
 WIS_flav.10_d:0 "The heralds unfurl the old Maratha standards in the durbar hall, and the elder soldiers stand a little straighter. To embrace the heritage is to inherit its martial pride — and its quarrels. To set it aside is to be simply a merchant kingdom on the sea, rich and unbothered."
 WIS_flav.10_a:0 "Raise the Maratha heritage over the crown"
 WIS_flav.10_b:0 "A merchant kingdom needs coin, not old banners"
 WIS_flav.11_t:0 "Salt and Sea Reform Pressure"
 WIS_flav.11_d:0 "From the salt pans of the coast a murmur rises — the same coast that gave India its most famous agitator. Cultivators and townsmen alike petition for a Praja Mandal, a people's assembly. The princely order watches to see whether Baroda will bend or hold."
 WIS_flav.11_a:0 "Concede a Praja Mandal assembly"
 WIS_flav.11_b:0 "The princely order holds firm"

 WIS_gaekwad_enlightenment:0 "The Gaekwad Enlightenment"
 WIS_gaekwad_enlightenment_desc:0 "Make Baroda the most enlightened court in India, as Sayajirao dreamed."
 WIS_free_libraries:0 "Free Public Libraries"
 WIS_free_libraries_desc:0 "A library in every town, open to every subject regardless of caste or purse."
 WIS_baroda_university:0 "Baroda College"
 WIS_baroda_university_desc:0 "Endow a great college to raise engineers, doctors, and administrators for the state."
 WIS_millowners_association:0 "The Millowners' Association"
 WIS_millowners_association_desc:0 "Bind the Ahmedabad textile magnates to the crown and let their capital drive our industry."
 WIS_arvind_mills:0 "The Arvind Mills"
 WIS_arvind_mills_desc:0 "Expand Kasturbhai's flagship mills into the largest cotton works east of Suez."
 WIS_textile_arsenal:0 "Looms into Arsenals"
 WIS_textile_arsenal_desc:0 "Convert the calico cluster into a war industry when the guns begin to speak."
 WIS_maritime_league:0 "The Kathiawar Maritime League"
 WIS_maritime_league_desc:0 "Federate the ports of Kathiawar and Kutch into a single merchant-marine power."
 WIS_bedi_port:0 "The Harbour at Bedi"
 WIS_bedi_port_desc:0 "Build the great modern port of Bedi at Jamnagar as the League's naval heart."
 WIS_diamond_road:0 "The Diamond Road"
 WIS_diamond_road_desc:0 "Master the Surat diamond guilds and the Gulf dhow trade for a river of hard currency."
 WIS_maratha_question:0 "The Maratha Question"
 WIS_maratha_question_desc:0 "Decide at last what the house of Gaekwad is: a Maratha crown, or an independent Gujarat."
 WIS_join_maratha_core:0 "Home to the Maratha Core"
 WIS_join_maratha_core_desc:0 "Answer the call of kin and bind Baroda's fate to the Maratha confederacy."
 WIS_independent_gujarat:0 "An Independent Gujarat"
 WIS_independent_gujarat_desc:0 "Reject the distant Peshwa and forge a sovereign Gujarati kingdom of the sea."
