 TRV_dewan_admin: "Sir C. P. Ramaswami Iyer"
 TRV_dewan_admin_desc: "The formidable Diwan runs Travancore as his personal machine, courting foreign powers over monazite while crushing every rival with police and patronage."
 TRV_sethu_regent: "Sethu Lakshmi Bayi"
 TRV_sethu_regent_desc: "The senior Maharani who ruled as reforming Regent; her calm, progressive hand still steadies the palace against the Diwan's ambitions."
 TRV_parvathi_patron: "Sethu Parvathi Bayi"
 TRV_parvathi_patron_desc: "The Junior Maharani and Queen Mother, patron of Sir C. P., works the durbar quietly to keep her faction ascendant."
 TRV_gv_raja_air: "Lt. Col. G. V. Raja"
 TRV_gv_raja_air_desc: "The consort prince who raised the Trivandrum aerodrome and Travancore's first air squadron now commands the young air arm."
 TRV_pattom_congress: "Pattom A. Thanu Pillai"
 TRV_pattom_congress_desc: "The first president of the Travancore State Congress presses for responsible government and an assembly answerable to the people."
 TRV_akkamma_agitator: "Akkamma Cherian"
 TRV_akkamma_agitator_desc: "The 'Jhansi Rani of Travancore' who led the great 1938 rally can summon the streets against the Diwan's terror."
 TRV_krishna_red: "K. Krishna Pillai"
 TRV_krishna_red_desc: "Founder of the Kerala communist movement, he organises the coir workers of the Alleppey belt for a red coastal revolution."
 TRV_bristow_harbour: "Robert Bristow"
 TRV_bristow_harbour_desc: "The engineer who dredged Willingdon Island and built modern Cochin Port turns a natural lagoon into a war harbour."
 TRV_bristow_theory: "Robert Bristow"
 TRV_bristow_theory_desc: "Master of naval logistics and harbour works, Bristow schools the fleet in the science of supply and safe anchorage."
 TRV_raman_research: "Sir C. V. Raman"
 TRV_raman_research_desc: "The Nobel laureate lends his genius to Travancore's chemical and physics laboratories, from Kundara outward."
 TRV_marthanda_legacy: "Marthanda Varma"
 TRV_marthanda_legacy_desc: "The founder who broke the Dutch VOC at Colachel in 1741 is invoked as the martial soul of the Travancore line."
 TRV_uthradom_hc: "Uthradom Thirunal Marthanda Varma"
 TRV_uthradom_hc_desc: "The dynastic heir lends the royal house to the high command, binding the state forces to the throne."
 TRV_rama_varma_scholar: "Rama Varma XVIII"
 TRV_rama_varma_scholar_desc: "The scholar-king of neighbouring Cochin brings his learning and legitimacy to the united Kerala coast."

 TRV_monazite_monopoly: "Monazite Monopoly"
 TRV_monazite_monopoly_desc: "The world-class thorium and rare-earth sands of Manavalakurichi give Travancore a bargaining chip no great power can ignore."
 TRV_padmanabhaswamy_treasury: "Padmanabhaswamy Treasury"
 TRV_padmanabhaswamy_treasury_desc: "The immense hidden wealth of the Sri Padmanabhaswamy temple underwrites the state, easing the burden on the people."
 TRV_highest_literacy: "Highest Literacy in India"
 TRV_highest_literacy_desc: "Travancore's schools and the new University give it the most literate population in the subcontinent, a deep well of skilled minds."
 TRV_nair_brigade: "The Nair Brigade"
 TRV_nair_brigade_desc: "The martial Nair tradition and the Travancore State Forces field a small but proud and disciplined army."
 TRV_fact_chemical_works: "FACT Chemical Works"
 TRV_fact_chemical_works_desc: "The Fertilisers and Chemicals Travancore works — the first Indian fertiliser plant — anchor a heavy-chemical industrial base."
 TRV_temple_entry_reform: "Temple Entry Proclamation"
 TRV_temple_entry_reform_desc: "The 1936 proclamation opening the temples to all Hindus binds a divided society to the throne with rare goodwill."
 TRV_secret_atomic_programme: "The Secret Atomic Programme"
 TRV_secret_atomic_programme_desc: "Thorium from the monazite sands feeds a clandestine research effort — Travancore reaches for the atom before any rival."
 TRV_independent_travancore: "An Independent Travancore"
 TRV_independent_travancore_desc: "Fertilisers, titanium, hydro power and a natural harbour: the Diwan proclaims that Travancore needs no master and stands alone."
 TRV_diwans_terror: "The Diwan's Terror"
 TRV_diwans_terror_desc: "Police, spies and patronage hold the state in an iron grip. Order reigns — but the assembly is silenced and dissent is crushed."
 TRV_responsible_govt: "Responsible Government"
 TRV_responsible_govt_desc: "An assembly answerable to the people and a constitutional monarchy channel Travancore's energies into consent rather than fear."
 TRV_red_coast: "The Red Coast"
 TRV_red_coast_desc: "The coir workers of Punnapra and Vayalar have risen. The Alleppey belt burns red and the revolution feeds on the sea."

 TRV_flav.1_t: "The Sands of Manavalakurichi"
 TRV_flav.1_d: "The black beach sands of Manavalakurichi are the richest monazite deposit in the world — thorium and rare earths that every armaments ministry in the West would pay a fortune to control. The Diwan sees not merely a mine but a lever of statecraft. Will Travancore hoard this treasure as a state monopoly, or quietly build the works to process it at home?"
 TRV_flav.1_a: "Declare a state monopoly on the sands"
 TRV_flav.1_b: "Build our own processing works first"
 TRV_flav.2_t: "Suitors for the Sands"
 TRV_flav.2_d: "Envoys arrive at Trivandrum with discreet offers. Arms, machine tools, warships — all can be had in exchange for privileged access to Travancore's monazite. Sir C. P. plays the courts of Europe against one another from behind the palace curtains."
 TRV_flav.2_a: "Trade monazite for foreign arms and favour"
 TRV_flav.2_b: "Bargain for industrial machinery instead"
 TRV_flav.3_t: "Thorium and the Atom"
 TRV_flav.3_d: "The physicists whisper of a power locked in the thorium itself — a weapon, or an engine, beyond anything the Deccan has seen. To chase it means diverting the state's best minds and its treasury into a secret few will ever know of. Or Travancore may simply sell the sands and grow rich and safe."
 TRV_flav.3_a: "Launch a secret atomic research programme"
 TRV_flav.3_b: "Sell the sands and bank the wealth"
 TRV_flav.4_t: "Travancore Shall Stand Alone"
 TRV_flav.4_d: "With fertiliser plants, titanium works, hydroelectric power at Pallivasal and the great harbour at Cochin, the Diwan judges Travancore self-sufficient. He proposes to proclaim a sovereign state, owing allegiance to no Confederacy and no distant crown. It is a gamble that could mean war."
 TRV_flav.4_a: "Proclaim an independent Travancore"
 TRV_flav.4_b: "Consolidate our strength and wait"
 TRV_flav.5_t: "The Arabian Sea Republic"
 TRV_flav.5_d: "A free Travancore looks west across the water. Cochin's harbour could make it a trading republic astride the spice and rubber routes, or a naval power guarding the Malabar coast. Bristow's dredgers stand ready."
 TRV_flav.5_a: "Build a fleet to guard the coast"
 TRV_flav.5_b: "Open Cochin as a free trading port"
 TRV_flav.6_t: "Fire in the Coir Belt"
 TRV_flav.6_d: "The coir workers of Alleppey have downed tools. Krishna Pillai's cadres speak of soviets and camps at Punnapra and Vayalar; the Diwan's police speak of machine guns. The coast trembles between revolution and repression."
 TRV_flav.6_a: "Unleash the police on the strikers"
 TRV_flav.6_b: "Let the movement swell unchecked"
 TRV_flav.7_t: "Punnapra and Vayalar"
 TRV_flav.7_d: "The camps have risen in open revolt. Red flags fly over the lagoons and the workers' militias dig in among the coir yards. This is the moment of decision — will the coast turn wholly red, or will the state break the rising by force?"
 TRV_flav.7_a: "Proclaim the Red Coast"
 TRV_flav.7_b: "Crush the rising and restore order"
 TRV_flav.8_t: "Terror or Responsible Government"
 TRV_flav.8_d: "The State Congress fills the streets demanding an assembly answerable to the people. Sir C. P. answers with police and prison. The Maharaja must choose the character of his state: the Diwan's iron order, or a constitutional monarchy that governs by consent."
 TRV_flav.8_a: "Back the Diwan's iron order"
 TRV_flav.8_b: "Grant responsible government"
 TRV_flav.9_t: "The First Fertiliser Plant"
 TRV_flav.9_d: "At Alwaye the Fertilisers and Chemicals Travancore works rise — the first true chemical industry in India. Ammonia, superphosphate, and the promise of a heavy-chemical base that could arm a nation as easily as it feeds one."
 TRV_flav.9_a: "Build the great chemical works"
 TRV_flav.9_b: "Import the plant and technicians"
 TRV_flav.10_t: "The Chemical Powerhouse"
 TRV_flav.10_d: "FACT, Travancore Titanium, aluminium at Aluva, hydro power from the hills — the coast hums with industry no southern rival can match. The question is whether to turn this base to arms, or to broaden it into a civilian colossus."
 TRV_flav.10_a: "Turn the works to armaments"
 TRV_flav.10_b: "Broaden the civilian industrial base"

 TRV_padmanabha_dawn: "Servants of Padmanabha"
 TRV_padmanabha_dawn_desc: "The Maharaja rules as the servant of Sri Padmanabhaswamy. Rally the coast under the temple banner and set Travancore's course."
 TRV_monazite_sands_focus: "The Monazite Sands"
 TRV_monazite_sands_focus_desc: "Survey and seize the thorium-rich beach sands of Manavalakurichi."
 TRV_rare_earth_monopoly: "A Rare-Earth Monopoly"
 TRV_rare_earth_monopoly_desc: "Corner the world market in monazite and turn it into political leverage."
 TRV_secret_research: "The Thorium Secret"
 TRV_secret_research_desc: "Turn the sands toward a clandestine atomic research effort."
 TRV_fact_plant: "The FACT Plant"
 TRV_fact_plant_desc: "Raise the Fertilisers and Chemicals Travancore works at Alwaye."
 TRV_titanium_works: "Travancore Titanium"
 TRV_titanium_works_desc: "Add titanium and heavy-chemical production to the industrial base."
 TRV_pallivasal_hydro: "Pallivasal Hydro"
 TRV_pallivasal_hydro_desc: "Harness the hill rivers for hydroelectric power to feed the works."
 TRV_university_travancore: "University of Travancore"
 TRV_university_travancore_desc: "Found the University and make Travancore the most literate land in India."
 TRV_temple_entry: "Temple Entry Proclamation"
 TRV_temple_entry_desc: "Open the temples to all Hindus and bind a divided society to the throne."
 TRV_constitution_question: "The Constitution Question"
 TRV_constitution_question_desc: "Decide how Travancore shall be governed as the State Congress presses its demands."
 TRV_diwans_terror_focus: "The Diwan's Iron Order"
 TRV_diwans_terror_focus_desc: "Rule through police, patronage and an unbending Diwan."
 TRV_responsible_govt_focus: "Responsible Government"
 TRV_responsible_govt_focus_desc: "Grant an assembly answerable to the people and a constitutional crown."
 TRV_nair_brigade_focus: "The Nair Brigade"
 TRV_nair_brigade_focus_desc: "Raise the Travancore State Forces on the martial Nair tradition."
 TRV_declare_independence: "Travancore Shall Stand Alone"
 TRV_declare_independence_desc: "Proclaim a sovereign Travancore, owing allegiance to no Confederacy."
 TRV_arabian_sea_republic: "The Arabian Sea Republic"
 TRV_arabian_sea_republic_desc: "Turn Cochin's harbour into the seat of a western-facing trading and naval power."
