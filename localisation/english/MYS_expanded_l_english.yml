l_english:
 MYS_walchand: "Walchand Hirachand"
 MYS_albion_banerjee: "Sir Albion Rajkumar Banerjee"
 MYS_madhava_rao: "Sir N. Madhava Rao"
 MYS_kantirava: "Kantirava Narasimharaja Wadiyar"
 MYS_krishnaraja_iii: "Krishnaraja Wadiyar III"
 MYS_tipu: "Tipu Sultan"
 MYS_hyder_ali: "Hyder Ali"
 MYS_walchand_hal: "Walchand Hirachand"
 MYS_walchand_hal_desc: "The industrialist behind Scindia Steam Navigation and Premier Automobiles wants to raise an aircraft works at Bangalore. Give him a war-industry portfolio and Mysore will build its own wings."
 MYS_banerjee_admin: "Sir Albion Banerjee"
 MYS_banerjee_admin_desc: "A seasoned Dewan of the old school, Banerjee keeps the machinery of state turning quietly while the reformers make speeches."
 MYS_madhava_reform: "Sir N. Madhava Rao"
 MYS_madhava_reform_desc: "The reforming Dewan who would widen the Representative Assembly and bind the throne to a modern civil service."
 MYS_kantirava_hc: "Kantirava Narasimharaja Wadiyar"
 MYS_kantirava_hc_desc: "The Yuvaraja lends the royal house to the high command, steadying the officer corps under the Wadiyar banner."
 MYS_krishnaraja_legacy: "Krishnaraja Wadiyar III"
 MYS_krishnaraja_legacy_desc: "The memory of the old cultural patron-king still moves the durbar; his legacy is invoked to bless the Dasara throne."
 MYS_tipu_rocketry: "Tipu Sultan"
 MYS_tipu_rocketry_desc: "The Tiger of Mysore pioneered iron-cased war rockets against the Company. His arsenal doctrine is studied anew in Mysore's workshops."
 MYS_hyder_theorist: "Hyder Ali"
 MYS_hyder_theorist_desc: "Mysore's great military modernizer, whose disciplined infantry and artillery train broke every rival in the Deccan."

 MYS_flav.1_t: "The Reconstruction of India"
 MYS_flav.1_d: "Sir M. Visvesvaraya lays his blueprint on the durbar table: a state-directed programme of dams, steel, and factories to lift Mysore from an agrarian principality into an industrial power within a decade. The Engineer-King's plan demands discipline and treasure — but it promises the strongest economy south of the Vindhyas."
 MYS_flav.1_a: "Adopt the Five-Year Plan wholesale"
 MYS_flav.1_b: "Begin cautiously with public works"
 MYS_flav.2_t: "Bhadravati or Bangalore?"
 MYS_flav.2_d: "The Mysore Iron & Steel Works at Bhadravati can be doubled to feed arms production, or the capital's civil industries expanded first. The Dewan's council is split between guns and looms."
 MYS_flav.2_a: "Pour steel into the arsenals"
 MYS_flav.2_b: "Build the civil economy first"
 MYS_flav.3_t: "The Plan Bears Fruit"
 MYS_flav.3_d: "Chimneys rise over the Cauvery valley and the ledgers balance in black. Mysore's industrial spine is set — now it must be turned to a purpose: permanent industrial primacy, or a treasury swollen enough to buy allies and armies."
 MYS_flav.3_a: "Institutionalize the planning bureau"
 MYS_flav.3_b: "Bank the surplus as political capital"

 MYS_flav.4_t: "Hindustan Aircraft at Bangalore"
 MYS_flav.4_d: "Walchand Hirachand proposes an aircraft factory on the Bangalore plateau — the first true aviation works of the subcontinent. Mysore could become the arsenal of the skies, if the throne underwrites the venture and the engineers can be found."
 MYS_flav.4_a: "Charter Hindustan Aircraft at once"
 MYS_flav.4_b: "Lay the aerodromes first"
 MYS_flav.5_t: "Foreign Engineers or Sovereign Works?"
 MYS_flav.5_d: "The new works needs licences, tooling, and trained men. Mysore may partner with the Maratha aviation bureau for technology, or insist on a wholly sovereign arsenal built the hard way from Mysore's own university men."
 MYS_flav.5_a: "Partner with the Maratha aviation bureau"
 MYS_flav.5_b: "Build a wholly sovereign arsenal"
 MYS_flav.6_t: "Wings Over Mysore"
 MYS_flav.6_d: "The first machines roll from the Bangalore sheds. Mysore's aviation arsenal is real — the question is whether to keep expanding the airfields or to sink the effort into ever-better designs."
 MYS_flav.6_a: "Expand the airfield network"
 MYS_flav.6_b: "Perfect the aircraft designs"

 MYS_flav.7_t: "The Regency Question"
 MYS_flav.7_d: "Krishnaraja Wadiyar IV is dead and the young Jayachamarajendra ascends the ivory throne. The court divides: shall the boy-king be surrounded by royal authority and Dasara ceremony, or shall the able Dewan govern in his name until he comes of age?"
 MYS_flav.7_a: "Enthrone the young Maharaja in full"
 MYS_flav.7_b: "Vest authority in the Dewan's council"
 MYS_flav.8_t: "The Shape of the Reign"
 MYS_flav.8_d: "However the succession is settled, Mysore's model of enlightened administration must be codified so that no future crisis of the crown can unmake it."
 MYS_flav.8_a: "Bind the model state to the throne"
 MYS_flav.8_b: "Bind the model state to the bureaucracy"
 MYS_flav.8_c: "Rally the army to the settlement"

 MYS_flav.9_t: "The Mysore Model versus Congress"
 MYS_flav.9_d: "Nationalist agitators demand responsible government and denounce princely paternalism. The Representative Assembly petitions for a wider franchise. The throne may co-opt the reformers and grant the assembly, or answer the agitation with the police and the Dasara pageant."
 MYS_flav.9_a: "Grant the assembly and co-opt reform"
 MYS_flav.9_b: "Repress the agitation, exalt the crown"
 MYS_flav.10_t: "The Verdict of the Durbar"
 MYS_flav.10_d: "The path Mysore has chosen now hardens into policy, and the character of the state is fixed in the eyes of every kingdom in the subcontinent."
 MYS_flav.10_a: "Proclaim the reformed model state"
 MYS_flav.10_b: "Proclaim the sovereign authority of the crown"
 MYS_flav.10_c: "Balance the factions with silver"

 MYS_flav.11_t: "Sandalwood and Gold"
 MYS_flav.11_d: "The Kolar Gold Fields — the deepest mines on earth — and the royal monopoly on sandalwood and silk can be forged into a war chest. The council debates whether to hoard bullion as political leverage or to plough the sandalwood revenues into new factories."
 MYS_flav.11_a: "Fill the treasury with Kolar gold"
 MYS_flav.11_b: "Reinvest the sandalwood revenues"
 MYS_flav.12_t: "The War Chest of the South"
 MYS_flav.12_d: "Mysore's coffers are the envy of the peninsula. The wealth may be turned to arms and armouries, or held in reserve as a fund of influence over the lesser courts."
 MYS_flav.12_a: "Convert the war chest to arsenals"
 MYS_flav.12_b: "Hold the wealth as political reserve"

 MYS_reconstruction_india: "The Reconstruction of India"
 MYS_reconstruction_india_desc: "Adopt Visvesvaraya's state-directed industrialization programme and set Mysore on the road to industrial primacy."
 MYS_bhadravati_expansion: "Bhadravati Steel Expansion"
 MYS_bhadravati_expansion_desc: "Double the Mysore Iron & Steel Works to feed the arms factories of the plateau."
 MYS_five_year_plan: "The Five-Year Plan"
 MYS_five_year_plan_desc: "Institutionalize the planning bureau and complete the Engineer-King's industrial spine."
 MYS_hal_bangalore: "Hindustan Aircraft at Bangalore"
 MYS_hal_bangalore_desc: "Charter Walchand's aircraft works and make Mysore the aviation arsenal of the subcontinent."
 MYS_aircraft_workshops: "The Aircraft Workshops"
 MYS_aircraft_workshops_desc: "Train fitters and engineers and stand up the production lines of the Bangalore sheds."
 MYS_aviation_arsenal: "Arsenal of the Skies"
 MYS_aviation_arsenal_desc: "Merge industrial capacity and aviation know-how into a self-sufficient air arm."
 MYS_regency_question: "The Regency Question"
 MYS_regency_question_desc: "Settle the succession of the young Jayachamarajendra Wadiyar."
 MYS_strengthen_monarchy: "Strengthen the Monarchy"
 MYS_strengthen_monarchy_desc: "Surround the throne with royal authority and Dasara ceremony."
 MYS_empower_diwan: "Empower the Dewan"
 MYS_empower_diwan_desc: "Vest working authority in the Dewan's council and the model civil service."
 MYS_kolar_treasury_focus: "The Kolar Treasury"
 MYS_kolar_treasury_focus_desc: "Turn the world's deepest gold mines into a royal war chest."
 MYS_sandalwood_war_chest: "The Sandalwood War Chest"
 MYS_sandalwood_war_chest_desc: "Fund the arsenals from the royal monopoly on sandalwood and silk."

 MYS_engineer_king_plan: "The Engineer-King's Plan"
 MYS_engineer_king_plan_desc: "State-directed industrialization on Visvesvaraya's model accelerates factory construction and political authority."
 MYS_bhadravati_plan: "Bhadravati Steel Complex"
 MYS_bhadravati_plan_desc: "The expanded iron and steel works speeds arms production and industrial output."
 MYS_hal_arsenal: "The HAL Aviation Arsenal"
 MYS_hal_arsenal_desc: "The Bangalore aircraft works speeds airfield construction, preserves trained pilots, and advances aircraft research."
 MYS_krs_hydro_power: "KRS Hydroelectric Power"
 MYS_krs_hydro_power_desc: "The Krishna Raja Sagara dam powers Mysore's factories and eases the burden of consumer goods."
 MYS_kolar_treasury: "The Kolar Gold Treasury"
 MYS_kolar_treasury_desc: "Bullion from the world's deepest mines swells the treasury and greases the wheels of diplomacy."
 MYS_model_state: "The Model State"
 MYS_model_state_desc: "Mysore's reputation for enlightened administration lends the throne stability and political authority."
 MYS_sandalwood_monopoly: "The Sandalwood Monopoly"
 MYS_sandalwood_monopoly_desc: "The royal monopoly on sandalwood and silk earns foreign silver and courtly favour."
 MYS_dasara_authority: "The Authority of the Crown"
 MYS_dasara_authority_desc: "The Dasara pageant and the exalted throne rally the people to war and steel the resolve of the state."
 MYS_carnatic_spirit: "Carnatic Cultural Renaissance"
 MYS_carnatic_spirit_desc: "Mysore's patronage of Carnatic music, Dasara, and the arts binds the people to the throne and its ambitions."
