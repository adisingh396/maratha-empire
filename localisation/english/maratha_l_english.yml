 MAR_mandala_1_title: "The Circle Read Anew"

 MAR_mandala_1_desc: "The pandits unroll the old Mandala: the neighbour is Ari, the enemy; the power beyond him, Mitra. Shall the durbar rule by fear of the near, or friendship of the far?"

 MAR_mandala_1_opt_ari: "Fear the near (Ari)"

 MAR_mandala_1_opt_mitra: "Court the far (Mitra)"

 MAR_mandala_ari_tt: "The durbar will watch its borders with suspicion."

 MAR_mandala_mitra_tt: "The durbar will seek friends beyond its enemies."

 MAR_mandala_2_title: "Ari on the Border"

 MAR_mandala_2_desc: "Across the frontier, drums beat in a rival capital. The sardars demand an answer: denounce the neighbour, or smother him in gifts?"

 MAR_mandala_2_opt_denounce: "Denounce the Ari"

 MAR_mandala_2_opt_gifts: "Send mangoes and gold"

 MAR_mandala_3_title: "Mitra Beyond the Enemy"

 MAR_mandala_3_desc: "Beyond our enemy sits another throne that fears him as we do. An embassy could turn geometry into friendship."

 MAR_mandala_3_opt_embassy: "Send the embassy"

 MAR_mandala_3_opt_spies: "Send spies instead"

 MAR_mandala_4_title: "The Quadruple League"

 MAR_mandala_4_desc: "As Nana Fadnavis did in 1780, the thrones of Hindustan are invited to stand together against the hegemon of the hour. Separation is death; together, arithmetic."

 MAR_mandala_4_opt_join: "Sign the league compact"

 MAR_mandala_4_opt_out: "Smile and stay out"

 MAR_mandala_5_title: "Thirty Pieces of Silver"

 MAR_mandala_5_desc: "A courier arrives at midnight with a chest that clinks. The hegemon buys one throne at a time — this time, yours."

 MAR_mandala_5_opt_silver: "Take the silver"

 MAR_mandala_5_opt_loyal: "Stay loyal to the league"

 MAR_mandala_6_title: "Chapati and Lotus"

 MAR_mandala_6_desc: "Bread and flowers pass village to village in the night. The countryside whispers as one. The durbar must answer before the whisper becomes a roar."

 MAR_mandala_6_opt_crackdown: "Crack down hard"

 MAR_mandala_6_opt_concede: "Concede and calm"

 MAR_mandala_7_title: "Proclaim the Digvijaya"

 MAR_mandala_7_desc: "The priests have read the stars and the generals have counted the battalions. Let the horse run to the four quarters and return: Chakravartin."

 MAR_mandala_7_opt_proclaim: "Proclaim it!"

 MAR_mandala_7_opt_delay: "Not yet"

 MAR_mandala_10_title: "A League Rises in Hindustan"

 MAR_mandala_10_desc: "Thrones that hated each other for a century have signed one compact. The hegemon's clerks are already counting the cost."

 MAR_mandala_10_opt: "The game begins"

 MAR_mandala_mercenary_tt: "Foreign blades, local pay. They will not die for the cause."

